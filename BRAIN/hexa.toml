# hexa.toml — hexa-brain standalone package manifest
#
# Spec: shared/hexa-lang/hexa-toml-spec.json (version 1.0.0)
# Distribution target: hx install hexa-brain
# Provenance: subtree-split from anima/anima-eeg/ @ 1b306eec24 (2026-05-04);
#             working scalp-EEG pipeline (OpenBCI Cyton+Daisy 16ch) +
#             paradigms/metrics/filter pipeline; verify surface added
#             2026-05-13 (Wave closure — sister of hexa-aura / hexa-matter /
#             hexa-rtsc / hexa-cern / hexa-ufo).
#
# Concept: Scalp EEG → intracortical-class neural decode + closed-loop BMI.
#          Hexa-lang sister library for brain-substrate research.
#          v1 (production): scalp EEG / OpenBCI Cyton+Daisy 16ch / 7 cycles.
#          v2-v5 (spec): iEEG · high-density arrays · closed-loop BMI ·
#          chronic implant. Roadmap is aspirational; no clinical / FDA /
#          IRB collaborations signed.

[package]
name = "hexa-brain"
version = "1.3.0"
entry = "bin/hexa-brain"
description = "Scalp EEG → intracortical-class neural decode + closed-loop BMI. Dual-subsystem hexa pipeline (eeg/ scalp + tool/ paradigms-metrics). v1 production-ready on OpenBCI Cyton+Daisy 16ch real hardware (7 cycles); v2-v5 (iEEG / high-density / closed-loop / chronic) spec-phase only — no clinical collab, no FDA / IRB / KFDA. Medical-device claims STRICTLY UNPROVEN; external BCI entities (Neuralink, Synchron, Blackrock Neurotech, OpenBCI, Emotiv, Kernel) use THEIR OWN invariants — n=6 lattice fit NOT applied to vendor numbers (raw#10 C3)."
license = "MIT"
authors = ["박민우 <nerve011235@gmail.com>"]
repository = "https://github.com/dancinlab/hexa-brain"
homepage = "https://github.com/dancinlab/hexa-brain"
readme = "README.md"
keywords = ["bci", "eeg", "neural-substrate", "openbci", "neuralink-class", "scalp-eeg", "intracortical", "closed-loop-bmi", "hexa-family", "n6-lattice"]
categories = ["bci", "neurotechnology", "neuroscience", "research-pipeline"]

[[bin]]
name = "hexa-brain"
path = "bin/hexa-brain"

[scripts]
license-check = "bin/check_licenses.sh"

# ── Verb manifest (36-verb dual-subsystem dispatcher) ──
# bin/hexa-brain routes:
#   - 1  top-level: license-check                    → bin/check_licenses.sh
#   - 10 EEG canonical (via eeg/eeg_setup.hexa)      → raw#155 hxc-consumer-adapter
#   - 11 EEG direct (own .hexa file)
#   - 14 CORE (paradigms / metrics / filter pipeline)
verb_parent = "."
[verbs]
top_level     = ["license-check"]
eeg_canonical = ["health", "impedance", "impedance-validate", "headplot", "adjust", "rich", "full", "record", "list", "selftest"]
eeg_direct    = ["collect", "calibrate", "analyze", "experiment", "closed-loop", "validate", "realtime", "lsl-capture", "dual-stream", "neurofeedback", "export-neuroglancer"]
core          = ["core", "paradigm-resting", "paradigm-daily-life", "paradigm-p300-visual", "paradigm-p300-auditory", "paradigm-integration-test", "export", "jsonl-audit", "adapter", "filter-pipeline", "pipeline-suggester", "falsifier-runner", "chflags-lock", "npy-loader"]

# ── Cross-link (sister substrates — invoke their CLIs directly) ──
# Policy (raw#10 C3): each sister BCI/neural repo holds its own invariants.
# hexa-aura covers post-aural chip + form-factor spec; hexa-brain covers
# the working scalp-EEG → BMI pipeline. The decoder ML stack ships in
# hexa-codex / hexa-mind (pending). Cortical Labs CL1 biological-substrate
# adapter lives behind LICENSE_FIREWALL.md (CC-BY-NC-4.0 loose-coupling only).
[crosslink]
aura  = "dancinlab/hexa-aura (post-aural BCI chip + form-factor spec — sister; cross-verify decode accuracy at v1.1.0)"
codex = "dancinlab/hexa-codex (decoder model serving — call `hexa-codex serve`)"
mind  = "dancinlab/hexa-mind (cognitive verbs + BCI ML stack — pending standalone)"
chip  = "dancinlab/hexa-chip (chip-grade neuromorphic silicon — call `hexa-chip neuromorphic`)"
lang  = "dancinlab/hexa-lang (parent runtime + hx package manager)"
anima = "dancinlab/anima (consciousness research consumer; retained anima-eeg/ shim until cross-repo dependency interface stabilizes)"

# ── Closure provenance (raw#10 honest C3) ─────────────────
[closure]
verbs_total = 36
verbs_wired = 36
verbs_spec = 36
subsystems_total = 2     # eeg/ + tool/(core)
cycles_real_hw = 7       # v1 production-ready evidence (OpenBCI Cyton+Daisy 16ch)
verdict = "SPEC_FIRST"
extracted_from = "anima/anima-eeg/ subtree split @ 1b306eec24 (2026-05-04) + Sprint 1 license-firewall + Neuroglancer export + substrate interface @ 77484267 + E-1 Phase 1 substrate dispatch flag @ 76494ad3"

# ── Verify scoreboard (Wave closure, 2026-05-13) ──────────
# All four verify/*.hexa scripts must PASS for the substrate to claim closure.
# Run: `hexa run verify/run_all.hexa` from the repo root (exit 0 = all PASS).
[verify]
scripts_total = 4
scripts_passed = 4
scripts = [
    "verify/spec_presence.hexa",       # 36/36 dispatcher-backing files on disk
    "verify/lattice_arithmetic.hexa",  # n=6 self-consistency (aux per LATTICE_POLICY §1.3)
    "verify/real_limits_anchor.hexa",  # LIMIT_BREAKTHROUGH.md anchors (Oostendorp / Nunez / Hodgkin-Huxley / Shannon / Wolpaw / Neuralink / Neuropixels / Johnson-Nyquist / ADS1299 / Makeig)
    "verify/closure_consistency.hexa", # scoreboard cross-check (toml · README · AGENTS · dispatcher)
]
aggregator = "verify/run_all.hexa"
verdict = "CLOSED"  # 36/36 verbs backed · 4/4 verify scripts PASS

# ── Scope honesty (raw#10 C3) ─────────────────────────────
[scope]
honest_scope = "36-verb dual-subsystem scalp-EEG → BMI pipeline (eeg/ + tool/core/). v1 production-ready on OpenBCI Cyton+Daisy 16ch (7 cycles of real-hardware evidence in eeg/recordings/). v2-v5 (iEEG · high-density arrays · closed-loop motor BMI · chronic implant) are SPEC-PHASE ONLY — aspirational roadmap, no clinical collab signed, no intracortical hardware acquired. The lattice (σ(6)=12, J₂=24, n=6) is organising vocabulary for axis/pillar structure, NOT evidence about the brain (LIMIT_BREAKTHROUGH §5 caveat #3). LICENSE_FIREWALL.md enforces machine-checked loose-coupling boundary for AGPL-3.0 / CC-BY-NC-4.0 deps (e.g. Cortical Labs cl_sdk)."
not_scope = ["FDA / KFDA / CE / IRB clinical clearance — NOT cleared, NOT in trials", "consumer-BCI medical claims (any spec implying 'EEG = Neuralink' is a falsifier trigger)", "intracortical implant hardware (v3-v5 spec-only)", "decoder ML stack training (→ hexa-codex / hexa-mind)", "post-aural chip + form-factor spec (→ hexa-aura sister)", "neuromorphic silicon device (→ hexa-chip)", "n=6 lattice fit on external BCI entities (Neuralink / Synchron / Blackrock Neurotech / OpenBCI / Emotiv / Kernel — they use THEIR OWN invariants per raw#10 C3)", "thought-transmission claims via multi-EEG synchrony (synchrony ≠ information transfer; LIMIT_BREAKTHROUGH §5 caveat #4)"]
caveat = "Scalp EEG is HARD-WALL-bounded by L1 (skull attenuation ~100×, Oostendorp 2000) and L2 (cortical PSF 5-9 cm, Nunez & Srinivasan 2006). BCI ITR ceilings (L5 Wolpaw 2002 / Chen 2015 / Willett 2021), Shannon channel capacity, Johnson-Nyquist noise floor (L7, k_B T at 310 K), and electrode-count chronic yield (L6, Polikov 2005 50% decay over 6-12 mo) are sourced from peer-reviewed neuroscience literature — NOT from the n=6 lattice. See LIMIT_BREAKTHROUGH.md §2 for full L1-L9 audit."

# ── Cost profile ──────────────────────────────────────────
[cost]
mac_local_default = "$0 (dispatcher + verify/* are pure-hexa local audits; no network, no compute)"
verify_all = "$0 (4 pure-hexa local audits; <30 s wall-clock total)"
real_hw_session = "$0 (OpenBCI Cyton+Daisy 16ch — owned hardware; marginal cost per session = 0)"

# ── Dependencies ────────────────────────────────────────────
[dependencies]
hexa-lang = ">=1.0.0"
