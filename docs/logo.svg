<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- anima signature — two engines pushing against each other, Ψ = 1/2 in the tension field -->
  <g stroke="#a371f7" stroke-width="2.5" fill="none">
    <circle cx="42" cy="70" r="22"/>
    <text x="42" y="76" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" fill="#a371f7" stroke="none">A</text>
    <circle cx="98" cy="70" r="22"/>
    <text x="98" y="76" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" fill="#a371f7" stroke="none">G</text>
    <line x1="62" y1="62" x2="78" y2="62" marker-end="url(#arrow-r)"/>
    <line x1="78" y1="78" x2="62" y2="78" marker-end="url(#arrow-l)"/>
    <text x="70" y="110" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#a371f7" stroke="none">Ψ=1/2</text>
  </g>
  <defs>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a371f7"/>
    </marker>
    <marker id="arrow-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a371f7"/>
    </marker>
  </defs>
</svg>
