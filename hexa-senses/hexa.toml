# hexa.toml — hexa-senses standalone package manifest
#
# 👁️ HEXA-SENSES — n=6 sensory substrate library (5-verb rollup)
# Provenance: extracted from canon@381f1f22 on 2026-05-07
#             (domains/cognitive/{hexa-dream, hexa-ear, hexa-empath,
#              hexa-olfact, hexa-speak}). hexa-speak is renamed
#              **hexa-voice** here per user directive (formulaic synthesis
#              only — learned models FORBIDDEN).

[package]
name = "hexa-senses"
version = "1.0.0"
entry = "cli/hexa-senses.hexa"
description = "👁️ HEXA-SENSES — n=6 sensory substrate library: dream / ear / empath / olfact / voice. Each verb is a closed-form spec deriving every parameter from σ(6)=12, τ(6)=4, φ(6)=2 number theory. voice is strictly formulaic (learned synthesis FORBIDDEN); the others span dream-recording, audio codec, emotion-transfer, e-nose. Sister-rollup of hexa-codex 17-verb cognitive substrate."
license = "MIT"
authors = ["박민우 <nerve011235@gmail.com>"]
repository = "https://github.com/dancinlab/hexa-senses"
homepage = "https://github.com/dancinlab/hexa-senses"
readme = "README.md"
keywords = ["sensory-substrate", "dream", "ear", "olfact", "empath", "voice", "canon", "hexa-family", "spec-catalog", "formulaic-synthesis"]
categories = ["sensory-substrate", "spec-catalog"]

[[bin]]
name = "hexa-senses"
path = "cli/hexa-senses.hexa"

[test]
runner = "hexa"
files = [
    "tests/test_selftest.hexa",
]

[test.python]
runner = "pytest"
marker = "auto"
files = [
    "tests/test_n6_invariants.py",
    "tests/test_verifiers.py",
    "tests/test_spec_inventory.py",
]

[scripts]
install = "install.hexa"

# ── Modules manifest (5 verb senses-rollup) ───────────────
[modules]
senses = [
    "dream/hexa-dream.md",       # multi-dream recording + τ=4 sleep-stage + σ=12 dream-category
    "ear/hexa-ear.md",           # σ·τ=48kHz sampling + J₂=24-bit quantization + n=6 neural codec
    "empath/hexa-empath.md",     # Ekman 6 emotions + σ=12 subcategories + J₂=24 biofeedback
    "olfact/hexa-olfact.md",     # σ=12 receptors + 2^σ=4096 odor patterns + τ=4s e-nose
    "voice/hexa-voice.md",       # Intent → audio token n=6 direct synthesis (NO TTS, formulaic)
]
verify = [
    "verify/run_all.hexa",            # aggregator (.hexa primary)
    "verify/spec_presence.hexa",      # 5/5 verb spec doc presence
    "verify/lattice_arithmetic.hexa", # n=6 self-consistency (aux per LATTICE_POLICY §1.3)
    "verify/real_limits_anchor.hexa", # LIMIT_BREAKTHROUGH.md anchors
    "verify/closure_consistency.hexa",# scoreboard cross-check
    "verify/cli.py",                  # legacy Python dispatcher (kept for pytest)
    "verify/n6_arithmetic.py",        # legacy n=6 arithmetic (kept for pytest)
    "verify/spec_inventory.py",       # legacy spec inventory (kept for pytest)
]
build = [
    "build/Makefile",            # verify + test + ci fan-out
]

[dependencies]
hexa-lang = ">=1.0.0"
python    = ">=3.10"   # stdlib only — no pip deps

# ── n=6 master identity ───────────────────────────────────
[invariants.n6]
sigma_6           = 12
tau_6             = 4
phi_6             = 2
J_2               = 24
master_identity   = "σ(6) · φ(6) = n · τ(6) = J₂ = 24"
verb_count        = 5
sigma_minus_phi   = 10
sigma_minus_tau   = 8
sigma_plus_tau    = 16

# ── Voice constraint (CRITICAL) ───────────────────────────
[constraints]
voice_synthesis = "formulaic-only"
voice_learning  = "FORBIDDEN — user directive 2026-05-07"
voice_rationale = "hexa-voice (= renamed hexa-speak) ships intent-to-audio-token direct synthesis. Learning-based TTS / neural codec violates the n=6 number-theoretic determinism — all parameters MUST derive from σ(6)=12, τ(6)=4, φ(6)=2."

# ── Closure provenance (raw#10 honest C3) ─────────────────
[closure]
verbs_total       = 5
verbs_wired       = 0
verbs_spec        = 5
verifiers_pass    = "4/4 (.hexa) — spec_presence · lattice_arithmetic · real_limits_anchor · closure_consistency"
verdict           = "SPEC_FIRST_100_PERCENT (5/5)"
extracted_from    = "canon@381f1f22 on 2026-05-07"
closure_pattern   = "hexa-matter verify pattern (4-script SPEC_FIRST + run_all aggregator)"
real_limits_first = "LATTICE_POLICY.md §1.2 anchors (psychophysics HARD walls; no lattice fits)"
closed_at         = "2026-05-13"

# ── Scope honesty (raw#10 C3) ─────────────────────────────
[scope]
honest_scope = "👁️ 5-verb sensory substrate library (dream/ear/empath/olfact/voice). Each verb ships a closed-form spec; eval pipelines + working .hexa modules deferred to post-v1.0 cycles."
not_scope = [
    "AI alignment / safety / interpretability (those live in hexa-codex)",
    "BCI hardware (lives in hexa-brain)",
    "consciousness / mind-upload / telepathy (lives in hexa-mind)",
    "learned voice synthesis (FORBIDDEN — formulaic only)",
]

[cost]
mac_local_default = "$0 (markdown spec library + Python stdlib + .hexa CLI)"
all_verbs         = "$0 (read-only)"
