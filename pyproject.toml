# ==========================================================================
# anima-py — anima 의 유일한 활성 canonical Python CLI.
# 단일진입 보존(a_cli_single_entry): console 명령 `anima-py` = cli/anima.py:main
# 의 콘솔 바인딩(동일 디스패처, 2nd entry 아님). 소스 복사 0 — 기존 cli/·core/
# 디렉토리를 package-dir 매핑으로 그대로 패키징(surgical·canonical-naming).
# base 의존 = numpy 만(evaluate·corpus); train/serialize/sweep = [train] extra;
# GPU decode/eval device path (cupy, optional) = [gpu] extra — a_gpu_default_no_optin:
# core/decode.py auto-detects cupy+CUDA at runtime (cuda_available()) and falls back to
# numpy unchanged when absent, so [gpu] is purely an accelerant install, never required
# for correctness (PY-smoke must still pass with a clean cupy-less venv).
# version = 루트 VERSION 파일 동적 참조 (VERSIONS.md §0 release SSOT · a1).
# ==========================================================================
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-python"
dynamic = ["version"]
description = "anima substrate-native consciousness engine — canonical Python CLI for runtime, training, evaluation, and corpus workflows"
readme = "anima_py/README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
train = ["torch>=2.1,<2.13", "datasets"]
runtime = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "websockets>=15,<17",
  "langdetect>=1.0.9,<2",
  "safetensors>=0.5,<1",
  "transformers>=4.48,<6",
  "peft>=0.14,<1",
]
test = ["pytest>=8,<10", "httpx2>=2,<3"]
# ⚠ torch UPPER BOUND IS LOAD-BEARING — torch 2.13+cu130 SILENTLY regresses store-addr
# held-out address generalization on Blackwell sm_120 bf16 training (H_9734: same code /
# corpus / base / seed / recipe, torch 2.11.0 generalizes addr 0.95, torch 2.13.0 memorizes
# only 0.0078). Independently, cli/pod_bootstrap.sh already flags 2.13+cu130 as a Triton
# JIT / first-kernel-crash trap. An unbounded torch>=2.1 lets a fresh install pull 2.13
# from the cu130 index → broken training. Pin < 2.13 until a newer torch is re-verified.
# cupy wheel is CUDA-major-version-specific; cupy-cuda12x covers CUDA 12.x runtimes
# (verified on RTX 5070 sm_120 · driver 580.x).
#
# ⚠ UPPER BOUND IS LOAD-BEARING — cupy 14.x is BROKEN on sm_120 (measured 2026-07-14,
# CUDA 13.0 / driver 580 / RTX 5070). Every JIT kernel compile fails because the
# cuda_fp8.hpp header cupy 14 bundles does not parse under nvrtc:
#     nvidia/cu13/include/cuda_fp8.hpp(1460): error: this declaration has no storage
#     class or type specifier                       ... 12 errors, NVRTC_ERROR_COMPILATION
# core/decode.py's cuda_available() only checks that `import cupy` succeeds and a device
# is visible — it cannot see that the kernels will not COMPILE — so an unbounded
# `>=13.0` silently installs the broken 14.x, cuda_available() returns True, and the
# first real forward dies mid-eval on a paid GPU. Pin below 14 until cupy fixes the
# header; a fresh pod must not be able to pick the broken wheel.
#
# A host on a different CUDA major (11.x/13.x) installs the matching cupy-cudaNNx wheel
# directly — core/decode.py only requires `import cupy` to succeed, it has no hard
# dependency on this exact wheel name. The <14 bound applies there too.
gpu = ["cupy-cuda12x>=13.0,<14"]
# CUDA 13 hosts (for example RTX 5070 sm_120, CUDA 13.0) need the cuda13 wheel — the
# cuda12 one imports but then dies on `libnvrtc.so.12: cannot open shared object file`, which
# cuda_available() now catches and reports, falling back to numpy. Install it explicitly:
#     pip install "anima-python[gpu]" && pip install "cupy-cuda13x>=13.0,<14"
# The <14 bound is the same load-bearing pin: cupy 14.x is broken on sm_120 (see above).
gpu-cuda13 = ["cupy-cuda13x>=13.0,<14"]

[project.scripts]
anima-py = "anima_py:main"

[tool.setuptools]
packages = ["anima_py", "anima_py.cli", "anima_py.core"]

[tool.setuptools.package-dir]
anima_py = "anima_py"
"anima_py.cli" = "cli"
"anima_py.core" = "core"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "state/h1058_agency_daemon",
  "lab/v3/tool",
]
python_files = ["test_*.py"]
pythonpath = [".", "core"]
