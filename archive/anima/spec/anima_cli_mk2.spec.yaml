    draft / unmet / met / partial / closed / archived / retired_intentional).
  values:
    active:
      description: "in use, current canonical for the entry"
      anima_cli_mk2_examples: [T1_chat_backend.clm_v4_substrate_coupled, T2_ops_dispatch]
    draft:
      description: "pre-baseline authoring state"
      anima_cli_mk2_examples: [v0.1_initial_design, v0.2_refinement_current]
    unmet:
      description: "gate / criterion not yet satisfied (internal)"
      anima_cli_mk2_examples: [T3_v2_0_actual_wire, F-anima_cli-6_observable_runtime_emit]
    met:
      description: "gate / criterion fully satisfied"
      anima_cli_mk2_examples: [Phase_0_spec_landed]
    partial:
      description: "gate satisfied for subset of scope"
      anima_cli_mk2_examples: [hive_mk2_apex_compliance (9 compliant + 10 gaps_remaining)]
    closed:
      description: "work complete, no further amend expected"
      anima_cli_mk2_examples: [own_17_directive_lock_in_2026_05_06]
    archived:
      description: "read-only preservation; successor cited"
      anima_cli_mk2_examples: [v0.1_pre_audit_design (Llama Path A v2 backend, replaced by v0.1_post_audit + v0.2)]
    retired_intentional:
      description: |
        Externally-blocked entry with honest documentation = PASS-equivalent.
        anima cli mk2 context: 외부 substrate (Llama / Mistral) backend lane =
        retired_intentional (external_blocker=own_17_directive,
        blocker_evidence=anima/.own own17, honest_doc=docs/anima_cli_mk2_
        philosophy_audit_2026_05_06.md).
      anima_cli_mk2_examples:
        - llama_path_a_v2_backend          # external_blocker=own_17, blocker_evidence=anima/.own own17
        - mistral_g3_backend                # external_blocker=own_17, blocker_evidence=anima/.own own17
      required_companion_fields:
        - external_blocker
        - blocker_evidence
        - honest_doc
  pass_equivalence_for_coverage_gates:
    retired_intentional: PASS_EQUIVALENT
    archived: PASS_EQUIVALENT
    closed: PASS_EQUIVALENT
    met: PASS
    partial: PARTIAL
    active: IN_PROGRESS
    draft: IN_PROGRESS
    unmet: FAIL
  cross_link:
    apex_axis: hive/spec/mk2_apex.spec.yaml § status_enum
    related_falsifier: F-anima_cli-6  # Llama backend retired_intentional 정합

