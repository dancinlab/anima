  # ─── phase transition rules ──────────────────────────────────────────────
  phase_transition_rules:
    description: "phase transition trigger — axes weight thresholds + cost axes 4 cap"
    rules:
      - from: P0
        to: P1_2
        trigger: "intent=open_ended AND chat_cap_PASS"
        axis_threshold: {chat_cap_simple_stack: ">=0.7"}
      - from: P0
        to: P6_5  # short-circuit: structured directive routes directly to absorb (예외)
        trigger: "intent=structured AND scope=cycle_close"
        axis_threshold: {chat_cap_simple_stack: ">=0.7"}
      - from: P1_2
        to: P3
        trigger: "novel_idea_count >= 1 AND emergence_axis >= 0.5"
        cost_cap: {resource: "<=0.7", speed: ">=0.3"}
      - from: P3
        to: P4_5
        trigger: "phi_star_no_flip OR new_axis_candidate"
        axis_threshold: {emergence: ">=0.7", singularity: ">=0.3"}
      - from: P3
        to: P6  # short-circuit: emerge instance 충분, breach skip
        trigger: "phi_star_no_flip AND no_breach_candidate"
      - from: P4_5
        to: P6
        trigger: "boundary_verify_done"
      - from: P6
        to: P6_5
        trigger: "meta_fixed_point_reached AND verdict_signed"
        axis_threshold: {convergence: ">=0.6"}
      - from: P6_5
        to: P0
        trigger: "absorbed_primitives_appended AND user_report_emitted"
        feed_forward: "new primitive registers as next-cycle seed"

