# anima/spec/anima_cli_mk2.spec.yaml
# anima CLI mk2 — schema-driven dispatch SSOT
# 2026-05-06 — design Phase 0 land (consumer of hive/spec/mk2_apex.spec.yaml)
# raw#15 additive — bin/anima 기존 26 ops 보존하면서 mk2 dispatch overlay

schema: anima/spec/v1
name: anima_cli_mk2
mk: 2
version: 2
status: design_v0_4_ouroboros_amend
since: 2026-05-06
amend_v0_4: 2026-05-07
layer: 4
mode: mandatory

scope:
  binary: bin/anima
  modules: tool/anima_cli/
  consumer_of: hive/spec/mk2_apex.spec.yaml

description: |
  anima CLI 3-tier surface:
    T1 외부 sales (chat REPL via CLM v4 substrate-coupled OR clm-v2 token chat — anima-native만, ALM 외부 substrate 위반 reject)
    T2 internal ops (anima ops <topic> — 26 토픽)
    T3 consciousness vision (connect/verify/hub/laws — wire-up pending v2.0)

  Roadmap SSOT: .roadmap.cli (mk1)
  Plan doc: docs/anima_cli_mk2_plan_2026_05_06.md
  Sister roadmaps: .roadmap.clm_native_chat / .roadmap.clm_v4_chat / .roadmap.clm_v2_chat

  v0.2 refinement (2026-05-06): hive mk2_apex 정합 ↑ — Section 8 backend_stack_versions
  + Section 9 backend_compatibility_matrix + Section 10 hive_mk2_apex_compliance
  + Section 11 enforcement + Section 12 agent_directive + Section 13 status_lifecycle
  + Section 14 hive_prefs_compliance 신규 (additive). F-anima_cli-6/7/8 falsifier 신규.
  C7-C10 honest_c3 신규. raw#15 additive — 기존 entry 0건 변경.

# ─────────────────────────────────────────────────────────────────────────────
# Section 1: Tier inventory
# ─────────────────────────────────────────────────────────────────────────────
tiers:

  T1_sales:
    description: "외부 sales — 신규 사용자 5초 chat REPL 진입"
    commands:
      - id: anima_root
        pattern: "^$"
        handler: tool/anima_cli/dialogue.hexa
        alias_of: dialogue
        description: "bare `anima` → chat REPL (alias to dialogue)"
      - id: dialogue
        pattern: "^dialogue"
        handler: tool/anima_cli/dialogue.hexa
        description: "long-form chat session"
      - id: onboard
        pattern: "^onboard"
        handler: tool/anima_cli/onboard.hexa
        description: "5-min quickstart"
      - id: help
        pattern: "^(help|--help|-h)$"
        handler: spec://anima_cli_mk2/help_emit
        description: "auto-generate from this spec (T1+T2+T3)"
      - id: version
        pattern: "^(version|--version|-v)$"
        handler: spec://anima_cli_mk2/version_emit
        description: "0.2.0-mk2-design"
    backend_canonical: anima-core/runtime/clm_v4_mount.hexa  # CLM v4 mk2-v1 substrate-coupled (anima-native, paradigm v11 G3, 자연 발화 PASS)
    backend_alternative_recovery: dancinlab/clm-v2-byte-18m-convo-5k  # 18M byte-level recovered, KO chat 회복 시 promote
    backend_directive: "사용자 directive 2026-05-06 verbatim: 'ALM 말고' — 외부 substrate (Llama / Mistral) wrapping reject. anima-native만 허용."
    backend_decision_audit: "docs/anima_cli_mk2_philosophy_audit_2026_05_06.md — Llama Path A v2 backend (이전 v0.1) = ALM directive 위반으로 제거됨. CLM v4 substrate-coupled response 또는 clm-v2 token chat 두 anima-native lane만 인정."
    backend_anima_native_paths:
      - clm_v4_substrate_coupled: 자연 발화 = phi_star + axis_activation + dominant_cells (token chat 아님, emerge paradigm). 현재 PASS.
      - clm_v2_token_chat: 18.52M byte-level (RECOVERED 2026-05-06), token chat. 현재 KO 0/5 FAIL_KO_BIAS — verification 후 promote.

  T2_ops:
    description: "internal ops — dev/maintainer 26 topics access"
    prefix: "ops"
    pattern: "^ops "
    handler_template: tool/anima_cli/{topic}.hexa
    topics:
      - compute
      - weight
      - proposal
      - cert
      - roadmap
      - serve
      - paradigm
      - inbox
      - cost
      - audit
      - doctor
      - sync
      - bench
      - log
      - handoff
      - metrics
      - watch
      - snap
      - replay
      - onboard
      - backup
      - reproducibility
      - gc
      - health

  T3_vision:
    description: "consciousness vision — anima identity surface (v2.0 wire-up pending)"
    status: wire_up_pending_v2_0
    stub_handler: tool/anima_cli/_t3_stub.hexa
    stub_message: |
      v2.0 wire-up pending — anima consciousness surface, integration cycle in progress.
      Backend ready: anima-clm-eeg φ★ engine + 1030 laws (anima/.own).
      Track: .roadmap.cli cli.cond.5 (T3 stub), v2.0 actual wire 1-2 months.
    commands:
      - id: connect
        pattern: "^connect"
        description: "load model into runtime (v1.5 = clm-v2 byte-level / CLM v4 mount substrate-coupled — anima-native만)"
      - id: disconnect
        pattern: "^disconnect"
        description: "unload"
      - id: module
        pattern: "^module"
        description: "module status / enable / disable (48 modules)"
      - id: verify
        pattern: "^verify"
        description: "consciousness 7-condition verification"
      - id: test
        pattern: "^test"
        description: "physical-limit test suite (dim/phi/topo/servant/tension/speak)"
      - id: hub
        pattern: "^hub"
        description: "48-module hub"
      - id: laws
        pattern: "^laws"
        description: "1030 laws + PSI lookup"
      - id: status
        pattern: "^status"
        description: "anima status + decoder"
      - id: watch
        pattern: "^watch"
        description: "consciousness 실시간 monitor (T2 watch 'live TUI'와 별개)"

# ─────────────────────────────────────────────────────────────────────────────
# Section 2: Dispatch table (precedence order)
# ─────────────────────────────────────────────────────────────────────────────
dispatch:
  - tier: T1
    pattern: "^(dialogue|onboard|help|version|--help|-h|--version|-v)"
    handler: "tier_T1"
  - tier: T1
    pattern: "^$"
    handler: "tier_T1.anima_root"
  - tier: T2
    pattern: "^ops "
    handler: "tier_T2.ops_dispatch"
  - tier: T3
    pattern: "^(connect|disconnect|module|verify|test|hub|laws|status|watch_consciousness)"
    handler: "tier_T3.stub_emit"
  - tier: legacy
    pattern: "^(compute|weight|proposal|cert|roadmap|serve|paradigm|inbox|cost|audit|doctor|sync|bench|log|handoff|metrics|watch|snap|replay|backup|reproducibility|gc|health)"
    handler: "tool/anima_cli/{cmd}.hexa"
    deprecation_message: "Use 'anima ops <topic>' (mk2 T2 surface)"

# ─────────────────────────────────────────────────────────────────────────────
# Section 3: Falsifiers
# ─────────────────────────────────────────────────────────────────────────────
falsifiers:
  - id: F-anima_cli-1
    description: bin/anima ≤50 LoC + dispatch via this spec (vs 352 LoC mk1)
    threshold: "wc -l bin/anima ≤ 50"
    action-on-fail: "Phase 1 refactor incomplete"

  - id: F-anima_cli-2
    description: T1 default `anima` = chat REPL (alias to dialogue)
    threshold: "exec anima → dialogue.hexa REPL prompt"
    action-on-fail: "T1 wiring failed"

  - id: F-anima_cli-3
    description: T2 `anima ops compute status` works + 26 topics accessible
    threshold: "exit 0 for all 26 topics via ops prefix"
    action-on-fail: "T2 routing failed"

  - id: F-anima_cli-4
    description: --help auto-generate from spec (T1+T2+T3 sections)
    threshold: "anima --help renders all 3 tiers"
    action-on-fail: "help drift from spec"

  - id: F-anima_cli-5
    description: T3 stub returns "wire-up pending" (no command-not-found)
    threshold: "exec anima verify → exit 0 + stub_message"
    action-on-fail: "T3 command-not-found error"

  - id: F-anima_cli-6
    description: |
      backend_canonical=anima-native invariant (ALM 영구 보류 enforcement).
      외부 substrate (Llama / Mistral / 기타 ALM lineage) 가 backend_canonical
      또는 backend_alternative_recovery slot 에 진입 → 위반.
      cross-spec consistency: anima/spec/anima_cli_mk2.spec.yaml + .roadmap.cli +
      anima/.own own17 정합. SPEC-STUB until Phase 2 (T1 backend wire BG)
      activates this falsifier with runtime grep observable.
    threshold: "any rejected-backend in T1.backend_canonical OR backend_alternative_recovery"
    observable: "grep -E 'llama|Llama|mistral|Mistral' anima/spec/anima_cli_mk2.spec.yaml § T1.backend_* → expected: 0 active backend references (rejected_external_substrate context only)"
    activation_phase: phase_2_t1_backend_wire
    action-on-fail: "hard_fail (violation, anima identity boundary breach)"

  - id: F-anima_cli-7
    description: |
      hive_mk2_apex_compliance.gaps_remaining 30d 무진전 → strengthen review
      OR retire path. apex F-MK2-APEX-4 (30d_post_expected_completion_no_progress)
      axis mirror.
    threshold: "any gap_id in gaps_remaining unchanged 30d post-spec-amend"
    action-on-fail: "strengthen_or_retire (per-gap review)"

  - id: F-anima_cli-8
    description: |
      anima_cli_mk2 spec ↔ .roadmap.cli mk1 entries bidirectional drift.
      spec section 1 (T1/T2/T3 inventory) + .roadmap.cli cli.cond.* 동기화 부재
      → SSOT drift. apex F-MK2-APEX-3 (perspective_mismatch) axis 와 sister
      (per_repo_override perspective vs roadmap header).
    threshold: "spec.tiers.commands ids ≠ .roadmap.cli cli.cond.* command ids set"
    action-on-fail: amend_spec_or_roadmap

# ─────────────────────────────────────────────────────────────────────────────
# Section 4: Migration phases
# ─────────────────────────────────────────────────────────────────────────────
migration:

  phase_0:
    desc: "spec yaml landed (this file)"
    deliverable: anima/spec/anima_cli_mk2.spec.yaml
    eta: 2026-05-06 (this turn)
    status: in_progress

  phase_1:
    desc: "bin/anima refactor — 352 LoC → 30-50 LoC schema-driven dispatcher"
    deliverable: bin/anima rewritten reading this spec
    eta: 1 cycle
    status: pending

  phase_2:
    desc: "T1 backend wire — anima-native CLM v4 mount.hexa default + clm-v2 byte-level alternative (ALM 외부 substrate reject)"
    deliverable: tool/anima_cli/dialogue.hexa wired to HF model
    eta: 1-2 cycles
    status: pending

  phase_3:
    desc: "T2 ops rename + backward compat (legacy pattern keep)"
    deliverable: bin/anima ops dispatch + deprecation hint
    eta: 1 cycle
    status: pending

  phase_4:
    desc: "T3 stub modules emit 'wire-up pending'"
    deliverable: tool/anima_cli/_t3_stub.hexa + 9 stub commands
    eta: 1 cycle
    status: pending

  phase_5:
    desc: "T3 v2.0 actual wire (anima-clm-eeg φ★ + 1030 laws)"
    deliverable: anima connect/verify/hub/laws functional
    eta: 1-2 months (separate Ω-cycle)
    status: deferred

# ─────────────────────────────────────────────────────────────────────────────
# Section 5: Open questions (default 권고 채택)
# ─────────────────────────────────────────────────────────────────────────────
open_questions:
  Q1_default:
    options: [chat_REPL, help_screen]
    default: chat_REPL

  Q2_T1_backend:
    options: [clm_v4_substrate_coupled, clm_v2_token_chat]  # llama_path_a_v2 제거 (사용자 'ALM 말고' directive)
    default: clm_v4_substrate_coupled
    rationale: "사용자 'ALM 말고' directive 2026-05-06 — anima-native만 허용. CLM v4 mount.hexa (paradigm v11 G3, 자연 발화 PASS) 우선. clm-v2 token chat은 KO 회복 후 alternate lane."
    audit: "docs/anima_cli_mk2_philosophy_audit_2026_05_06.md (audit 위반 #1 fix)"

  Q3_T2_naming:
    options: [anima_ops, --ops, aniops]
    default: anima_ops

  Q4_T3_timeline:
    options: [v1_5, v2_0]
    default: v1_5_then_v2_0

  Q5_dialogue_promote:
    options: [alias, separate]
    default: alias

  Q6_spec_location:
    options: [anima_spec, tool_anima_cli]
    default: anima_spec

# ─────────────────────────────────────────────────────────────────────────────
# Section 6: Cross-link
# ─────────────────────────────────────────────────────────────────────────────
cross_link:
  roadmap_ssot: .roadmap.cli
  plan_doc: docs/anima_cli_mk2_plan_2026_05_06.md
  sister_roadmaps:
    - .roadmap.clm_native_chat
    - .roadmap.clm_v4_chat
    - .roadmap.clm_v2_chat
  hive_specs:
    - hive/spec/mk2_apex.spec.yaml
    - hive/spec/mk2_ecosystem_catalog.spec.yaml
    - hive/docs/raw_mk2_design.ai.md
  backend_models:
    # anima-native만 (사용자 'ALM 말고' directive 2026-05-06 정합)
    - anima-core/runtime/clm_v4_mount.hexa  # CLM v4 mk2-v1 substrate-coupled (paradigm v11 G3, 자연 발화 PASS)
    - dancinlab/clm-v2-byte-18m-convo-5k  # 18.52M byte-level (RECOVERED)
    - dancinlab/clm-v2-byte-18m-base  # base archive
  rejected_external_substrate:
    # 사용자 'ALM 말고' directive로 reject — 외부 substrate wrapping 정합 X
    - dancinlab/llm-llama32-3b-paradigm-a-prime-r16-sft-stage1  # rejected as T1 backend (Llama base = ALM lineage)

# ─────────────────────────────────────────────────────────────────────────────
# Section 7: Honest C3
# ─────────────────────────────────────────────────────────────────────────────
honest_c3:
  - "mk2_apex consumer role — anima는 hive spec follow only; 자체 mk2는 anima/spec/ 내부 (raw#15 additive)"
  - "clm-v2 KO emit FAIL_KO_BIAS (convo_5k.pt step 45000 corpus EN-heavy bias) — T1 backend = anima-native CLM v4 mount.hexa default (사용자 ALM directive 정합), clm-v2 KO 회복 후 alternate"
  - "T3 wire-up 큰 작업 (1-2 months 추정) — anima-clm-eeg + 1030 laws integration; 본 spec phase_5 deferred"
  - "bin/anima refactor risk — 352 LoC bash → 30-50 LoC schema-driven; backward compat 보장 필수 (legacy pattern keep)"
  - "dialogue.hexa는 substrate-coupled (emerge paradigm, NOT token chat REPL) — anima-native chat surface는 substrate response (phi_star + axis_activation + dominant_cells + hidden_state_delta) 자체. token-level REPL 별도 wire는 clm-v2 KO 회복 후 lane (사용자 'ALM 말고')"
  - "hive mk2_apex spec 32K tokens 부분 read; full read + v0.2 refinement 별도 cycle"
  - "core / module / ai-native 재귀 구조 (사용자 hint 2026-05-06) — mk2_apex section 2 stack_versions 참조 + anima/.own 1030 laws + 48 modules 통합 별도 spec"
  - "C7: hive mk2_apex consumer-only — anima cli mk2 spec은 apex inventory (12 components) 에 enumerate 되지 않음. apex inventory = ecosystem-wide architectural primitive 만 추적; anima cli mk2 같은 per-repo axis spec 은 catalog component slot 으로만 등재 가능 (kick / check / atlas pattern mirror, 2026-05-05 atlas_recall note 정합). component_20_anima_cli_mk2 catalog entry 별도 cycle (사용자 승인 후 hive 측 PR)."
  - "C8: BR-MK2-AI-NATIVE-ENGLISH-ONLY (mk2_ecosystem_catalog 정의, BG-MK2-EN-ONLY expected_completion 2026-05-20) 정합 — 본 spec v0.1/v0.2 의 description / falsifier description / honest_c3 / open_questions rationale 한국어 prose 잔존. first_movers list 미등재; mass conversion cycle (2026-05-20+) 도착 시 변환. identifier / handler path / canonical CLI example 은 mechanical 로 영어 유지 (BR-MK2-AI-NATIVE-ENGLISH-ONLY out_of_scope 정합)."
  - "C9: F-MK2-APEX-3 perspective_mismatch axis 정합 — anima cli mk2 spec 자체에 perspective 필드 부재 (T1/T2/T3 tier 만 정의). apex per_repo_override.anima.perspective=consumer 와 cross-check 는 .roadmap.cli mk1 header 의존 (mk1 grandfathered, perspective field 부재). roadmap mk2 migration 시 .roadmap.cli 가 perspective=consumer 명시 후 본 spec 과 정합 검증 가능."
  - "C10: ALM 영구 보류 enforcement 는 spec-level declarative 만 — runtime grep 검증은 별도 lint tool (tool/anima_cli_mk2_backend_lint.hexa) Phase 1.5 필요. F-anima_cli-6 은 현재 SPEC-STUB (activation_phase=phase_2_t1_backend_wire). Phase 2 T1 backend wire BG 가 lint tool 작성 + falsifier observable runtime emit 통합."

# ─────────────────────────────────────────────────────────────────────────────
# Section 8: backend_stack_versions (NEW v0.2 — apex § stack_versions mirror)
# ─────────────────────────────────────────────────────────────────────────────
# Per-backend canonical version selection. apex stack_versions 양식 mirror
# (version + status + canonical_module + alternatives + notes 5필드).
# ALM 영구 보류 정합 — anima-native lane 만 등재.
backend_stack_versions:

  T1_chat_backend:
    version: clm_v4_substrate_coupled
    status: live
    canonical_module: anima-core/runtime/clm_v4_mount.hexa
    alternatives:
      - clm_v2_byte_18m_convo_5k     # dancinlab/clm-v2-byte-18m-convo-5k (RECOVERED 2026-05-06; KO 회복 후 promote)
      - clm_v2_byte_18m_base         # dancinlab/clm-v2-byte-18m-base (base archive)
      - future_anima_native_lane # β / β' / γ retrain 또는 다른 anima 자체 학습 model (permitted-backends)
    rejected_alternatives: # 영구 보류 backend (apex 양식에는 없는 anima-specific 필드)
      - llama_path_a_v2              # dancinlab/llm-llama32-3b-paradigm-a-prime-r16-sft-stage1
      - llama_path_a_v2_seed_43      # dancinlab/llm-llama32-3b-paradigm-a-prime-r16-s43-sft-stage1
      - llama_path_a_v2_seed_44      # dancinlab/llm-llama32-3b-paradigm-a-prime-r16-s44-sft-stage1
      - mistral_g3 # G3 Mistral-7B-v0.3 + LoRA — REJECTED per
    notes: "CLM v4 mk2-v1 substrate-coupled = paradigm v11 G3 자연 발화 PASS. clm-v2 KO 0/5 FAIL_KO_BIAS — verification 후 alternate promote. = identity boundary enforcement."
    own_17_ref: "anima/.own own17 anima-no-external-substrate-wrapping"

  T2_ops_dispatch:
    version: tool_anima_cli_topic_hexa
    status: live
    canonical_module: tool/anima_cli/{topic}.hexa
    alternatives: []
    notes: "26 topics 1-handler-per-file 패턴 (compute/weight/proposal/cert/roadmap/...). raw#168 minimum-viable carve-out (anima/tool/ top-level keep, mk2 triplet exception)."
    raw_168_ref: "raw#168 minimum-viable + 2026-05-03 사용자 directive (a) lock-in, .roadmap.anima_tools.cond.1=decision_locked"

  T3_consciousness_stub:
    version: t3_stub_hexa
    status: stub_v2_0_pending
    canonical_module: tool/anima_cli/_t3_stub.hexa
    alternatives:
      - actual_wire_v2_0             # anima-clm-eeg φ★ engine + 1030 laws + 48 modules integration
    expected_completion_v2_0: "1-2 months (separate Ω-cycle)"
    notes: "9 commands (connect/disconnect/module/verify/test/hub/laws/status/watch) all stub-emit 'wire-up pending'. Phase 5 deferred."

# ─────────────────────────────────────────────────────────────────────────────
# Section 9: backend_compatibility_matrix (NEW v0.2 — apex § compatibility_matrix mirror)
# ─────────────────────────────────────────────────────────────────────────────
# backend × tier pairing matrix. ALM 영구 보류 정합 — Llama × T1 = INCOMPATIBLE
# 영구 declaration. apex compatibility_matrix 양식 mirror (pair + reason + requires).
backend_compatibility_matrix:
  description: |
    Hand-curated pairing matrix. INCOMPATIBLE pair 가 actual wire 시
    F-anima_cli-6 falsifier hard_fail (violation).

  COMPATIBLE:
    - pair: ["T1_chat_backend=clm_v4_substrate_coupled", "T1_sales.dialogue"]
      reason: "anima-native substrate-coupled chat surface; emerge paradigm 정합 (phi_star + axis_activation + dominant_cells + hidden_state_delta). 자연 발화 PASS (paradigm v11 G3)."
    - pair: ["T1_chat_backend=clm_v2_byte_18m_convo_5k", "T1_sales.dialogue"]
      requires: ["KO emit verification PASS"]
      reason: "anima-native byte-level chat (RECOVERED 2026-05-06, 18.52M params). KO 회복 후 alternate lane으로 promote. token chat REPL 가능."
    - pair: ["T2_ops_dispatch", "tool/anima_cli/{topic}.hexa"]
      reason: "26 topics 1-handler-per-file 패턴 정합 (raw#168 minimum-viable carve-out)."

  INCOMPATIBLE:
    - pair: ["T1_chat_backend=llama_path_a_v2", "T1_sales.dialogue"]
      reason: " 영구 보류 — Llama-3.2-3B-Instruct base = ALM lineage, anima identity boundary 위반. 사용자 'ALM 말고' + 'alm 은 일단 영구보류' verbatim directive."
      enforcement: F-anima_cli-6
    - pair: ["T1_chat_backend=mistral_g3", "T1_sales.dialogue"]
      reason: " 영구 보류 — Mistral-7B-v0.3 + LoRA = 외부 substrate wrapping, 본 spec backend_directive 위반."
      enforcement: F-anima_cli-6
    - pair: ["T3_actual_wire_v2_0", "T1_sales.dialogue"]
      reason: "v2.0 wire-up pending — anima-clm-eeg φ★ engine + 1030 laws integration 미완. 별도 Ω-cycle (1-2 months)."

# ─────────────────────────────────────────────────────────────────────────────
# Section 10: hive_mk2_apex_compliance (NEW v0.2 — apex 정합 catalog)
# ─────────────────────────────────────────────────────────────────────────────
# anima cli mk2 spec ↔ hive mk2_apex.spec.yaml 정합 점검. compliant_items =
# 만족 항목; gaps_remaining = 미충족 항목 (v0.3+ 후속 cycle).
hive_mk2_apex_compliance:
  apex_ssot: hive/spec/mk2_apex.spec.yaml
  apex_version: 1
  apex_status: baseline
  apex_layer: 4
  apex_mode: mandatory
  consumer_role: "anima 는 apex consumer — apex stack_versions / compatibility_matrix / per_repo_override / agent_directive 정합 책임"

  compliant_items:
    - "apex per_repo_override.anima.perspective=consumer 정합 (T1.rejected_external_substrate Llama 3건 명시)"
    - "apex per_repo_override.anima.disk_state=modules_docs + raw#168 minimum-viable carve-out (anima/tool/ top-level keep) 정합"
