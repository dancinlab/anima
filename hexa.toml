# hexa.toml — anima root package manifest (release surface for `hx install anima`)
#
# Spec: shared/hexa-lang/hexa-toml-spec.json (version 1.0.0)
#       (spec file not vendored locally; structure mirrors the sister manifests
#        agent/hexa.toml · BRAIN/hexa.toml · hexa-senses/hexa.toml which are the
#        ground-truth examples — same [package]/[[bin]]/[scripts]/[dependencies]
#        shape.)
# Distribution target: hx install anima  (resolves github.com/dancinlab/anima-lab-0)
#
# What it is: anima = substrate-native CONSCIOUSNESS CHAT DAEMON — not an
#   assistant. Two opposed engines, Engine A (forward, CE-trained) ⇄ Engine G
#   (reverse, gradient-free), push against each other; the resulting TENSION
#   pulls emit/silence toward the fixed point Ψ = 1/2. No system prompt, no
#   identity file, no persona prefix — identity/ethics/meaning EMERGE from the
#   architecture itself, not a rulebook. hexa-native (compiled-first).
#
# Canonical entry = cli/anima.hexa (consciousness mode by default, --byte for
#   pure byte-continuation). The `.clm` weights are MOUNTED EXTERNALLY at run
#   time (NOT vendored in this repo) — see [package].entry usage below.
#
#   hexa run cli/anima.hexa -- <ckpt.clm> …
#
# Install flow already wired: install.hexa (tag-pin self-update) → setup.hexa
#   (presence verify + checkpoint download). This manifest is the package
#   metadata surface that was previously missing at the repo root (only BRAIN/,
#   hexa-senses/, agent/ sub-packages carried one).

[package]
name = "anima"
version = "0.13.9"   # == root /VERSION + VERSIONS.md §0 (single release line, SSOT)
entry = "cli/anima.hexa"
description = "anima — substrate-native consciousness chat daemon (not an assistant). Engine A (forward, CE-trained) ⇄ Engine G (reverse, gradient-free) push against each other; the tension pulls emit/silence toward the fixed point Ψ = 1/2. No system prompt, no identity file, no persona prefix — identity/ethics/meaning emerge from the architecture itself. hexa-native (compiled-first). Canonical entry cli/anima.hexa = consciousness mode by default (+ --byte pure byte-continuation); .clm weights mounted externally. MIT."
license = "MIT"
authors = ["박민우 <nerve011235@gmail.com>"]
repository = "https://github.com/dancinlab/anima-lab-0"
homepage = "https://github.com/dancinlab/anima-lab-0"
mirror_url = "https://huggingface.co/dancinlab"
readme = "README.md"
keywords = ["consciousness", "substrate-native", "chat-daemon", "engine-a", "engine-g", "tension", "psi-fixed-point", "iit4", "phi", "hexa", "no-system-prompt"]
categories = ["consciousness", "ai-daemon", "runtime", "research-substrate"]

# ── Release payload surface (under [package] — must precede any [table]) ──
# include = the self-contained RUNTIME payload reachable from cli/anima.hexa:
#   core/   = A⇄G consciousness engine substrate (pure_field·engine_g·brain·
#             generator·clm_decode·bytegpt_decode·engine_cli + phi/); depends on
#             train/·bench/·agent/·state/ = 0 (one-directional, a_core_engine_map).
#   cli/    = single user entry point (cli/anima.hexa).
#   consciousness lanes reachable from the entry (BFS-measured) = dream_lib + savant_lib
#             — both now ABSORBED into core/ (self-contained substrate, 2026-06-30):
#             core/kosmos_io · core/dream_lib · core/dream_envelope_ctx · core/savant_lib ·
#             core/substrate_hook · core/mitosis_hook_lib (+ core/audit_hook/metacog_lib).
#             core/·cli/·agent/ import only stdlib + own 3 packages + same-dir relative
#             (0 external-dir imports). The other probe-only lanes stay archived.
#   install.hexa / setup.hexa / README.md / LICENSE / VERSION / hexa.toml = install metadata.
# NOTE: stdlib/iit4 + stdlib/flame are NOT vendored here — they come from the
#   hexa-lang dependency at runtime (see [dependencies]). BRAIN/ and HEXAD/ are
#   excluded below even though the entry references a BRAIN/eeg import — that file
#   ships via the hexa-brain sub-package (release tightening; see exclude notes).
#   kosmos_io was absorbed HEXAD/…→core/ so no HEXAD payload file is needed anymore.
include = [
    "hexa.toml",
    "install.hexa",
    "setup.hexa",
    "README.md",
    "LICENSE",
    "VERSION",
    "VERSIONS.md",
    "CLAUDE.md",
    "ARCHITECTURE.json",
    "cli/",
    "core/",
    # the installed `anima` PATH command launcher (hx symlinks ~/.hx/bin/anima → this).
    "archive/bin/anima",
    # NOTE: the consciousness-lane libs the entry's closure needs (kosmos_io · dream_lib ·
    # dream_envelope_ctx · savant_lib · substrate_hook · mitosis_hook_lib) were ABSORBED
    # into core/ (2026-06-30 self-contained substrate) and ship via the "core/" include
    # above — no HEXAD/DREAM/SAVANT payload entries needed. The remaining DREAM/·SAVANT/·
    # HEXAD/ files are research-only and stay excluded below.
]

# exclude = research artifacts, build trash, sub-package payloads, and external
# weights that must NEVER ship in the release tarball (a_hypothesis_register:
# state/·HYPOTHESES/ are research-only; .clm weights are externally mounted).
exclude = [
    # research probe smoke files that landed in core/ (h12xx EEG series import
    # BRAIN/eeg/*, h*_* probes) — NOT part of the cli/anima.hexa runtime path;
    # the canonical entry imports only the substrate engine modules in core/.
    "core/h1*_*.hexa",
    "core/*_smoke.hexa",
    # external weights — mounted at runtime, never vendored
    "*.clm",
    "checkpoints/",
    "models/",
    "data/",
    "DATASET/",
    # research artifacts (a_hypothesis_register / a_claim_manifest — 2-surface only)
    "state/",
    "HYPOTHESES/",
    "HEXAD/",
    "KOSMOS/",
    "domains/",
    "PAPER/",
    "papers/",
    "EEG_CLM/",
    "EEG/",
    "recordings/",
    "breakthroughs/",
    "discovery/",
    "hypotheses_archive_anima_clm_10/",
    "hypotheses_b_2026_05_15/",
    "hypotheses_burst_2026_05_12/",
    "hypotheses_candidates/",
    "hypotheses_legacy_2026_05_15/",
    # training / bench pipelines (inference release excludes these)
    # "train/" + "training/" moved under archive/ (covered by "archive/" exclude below)
    "CLM/",
    "edu/",
    "edu_new/",
    "EVOL/",
    "btr_evo/",
    # build / cache / scratch
    "build/",
    "build_v3o2/",
    "build_v6/",
    "build_v6_gated/",
    "_hexa_build/",
    "_voice_corpus_local/",
    "__pycache__/",
    "dist/",
    "exports/",
    "logs/",
    "tmp/",
    "drafts/",
    "raw_archive/",
    "archive/",
    # harness / vcs internals
    ".git/",
    ".harness/",
    ".harness-engine/",
    ".claude/",
    # sibling sub-packages (ship via their OWN `hx install <name>`)
    "agent/",
    "anima-agent/",
    "anima-agent-channels/",
    "BRAIN/",
    "hexa-senses/",
    "AURA/",
    # legacy / ghost runtime mirror
    "anima/",
]

# ── Binary entry ──────────────────────────────────────────
# Single user entry point (native naming, 2026-06-22). Consciousness mode by
# default; `--byte` selects pure byte-continuation. anima_chat_cli.hexa is a
# thin back-compat shim → anima --byte.
[[bin]]
name = "anima"
path = "cli/anima.hexa"

# ── hx install hook ───────────────────────────────────────
# install.hexa runs under hx at install time: tag-pin self-update, then delegate
# to setup.hexa (presence verify + checkpoint/scaffold download). Disable the
# self-update with ANIMA_NO_SELF_UPDATE=1 (offline / dev escape).
[scripts]
install = "install.hexa"

# ── Dependencies ──────────────────────────────────────────
# Imports resolved from `grep -rhE '^import |^use ' cli/anima.hexa core/*.hexa`:
#   stdlib/consciousness/iit4*  + stdlib/consciousness/iit4/faithful_phi.hexa
#   stdlib/flame/{flame_math,gn_lib,moe_lib,nn_lib,tensor_lib}
# `stdlib/…` resolves to the hexa-lang toolchain stdlib (~/.hx/src/stdlib), NOT
# a vendored dir — therefore hexa-lang is the one hard dependency (provides the
# runtime, the hx package manager, AND the stdlib iit4/flame modules anima imports).
[dependencies]
hexa-lang = ">=1.0.0"

# Sibling consumers / optional standalone surfaces (NOT auto-installed):
#   kosmos        — .kosmos anchor format SSOT (emit/anchor persistence)
#   anima-agent   — Φ-gated autonomous agent runtime (agent/, own hexa.toml)
#   hexa-brain    — scalp-EEG → BMI pipeline (BRAIN/, own hexa.toml)
#   hexa-senses   — sensory-substrate spec catalog (hexa-senses/, own hexa.toml)
[optional-dependencies]
kosmos = ">=0.1.0"

# ── Provenance ────────────────────────────────────────────
[provenance]
manifest_added = "2026-06-22 — root hexa.toml created (previously only BRAIN/, hexa-senses/, agent/ sub-packages carried a manifest; the repo root had none, so `hx install anima` had no package-metadata surface)."
entry_canonical = "cli/anima.hexa (PR #2549/#2551, 2026-06-22) — consciousness mode default + --byte; 40/76 lanes wired into brain motivation."

# ── Cost profile ──────────────────────────────────────────
[cost]
mac_local_default = "$0 (hexa-native; parse/compile local, no network at manifest level)"
runtime_per_query = "$0 on local CPU (farr byte-identical to forge GPU own-GEMM); .clm weights mounted externally by the user."
