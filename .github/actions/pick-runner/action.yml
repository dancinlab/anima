name: pick-runner
description: >-
  Fallback-dispatch runner picker — emits a label output that is the self-hosted
  pool label-array when a matching runner is ONLINE (and the event is same-repo /
  not a fork PR), else the free GitHub-hosted fallback. Consume downstream by
  passing the output through fromJSON into a job runs-on. Pool-offline never
  wedges a (possibly required) gate — it just falls back.

inputs:
  kind:
    description: 'linux | darwin — which pool to probe'
    required: true
  eligible:
    description: >-
      "1" if self-hosted is allowed for this event (same-repo push / dispatch /
      non-fork PR), "0" to force the GitHub-hosted fallback (fork-PR RCE guard).
      Callers pass the same-repo guard expression evaluating to "1" or "0".
    required: true
  token:
    description: 'GitHub token for the runners API probe (administration:read needed for self-hosted routing; github.token → harmless cloud fallback)'
    required: true

outputs:
  label:
    description: 'JSON runs-on value (array for self-hosted, string for fallback)'
    value: ${{ steps.pick.outputs.label }}

runs:
  using: composite
  steps:
    - name: pick runner (self-hosted-if-online, else GitHub-hosted)
      id: pick
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SELF_HOSTED_ELIGIBLE: ${{ inputs.eligible }}
        # GITHUB_REPOSITORY is provided by the runner automatically.
      run: |
        set -uo pipefail
        # The shared picker writes `<kind>_label=<json>` to $GITHUB_OUTPUT; we
        # normalise it to this composite's single `label` output.
        bash tool/ci_pick_runner.sh "${{ inputs.kind }}"
        val="$(grep -E "^${{ inputs.kind }}_label=" "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
        echo "label=$val" >> "$GITHUB_OUTPUT"
