name: pypi-release

on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish anima-python
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/anima-python/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist_py
          python -m twine check dist_py/*
          python -m venv /tmp/anima-pypi-smoke
          wheel="$(find "$PWD/dist_py" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          [ -n "$wheel" ]
          /tmp/anima-pypi-smoke/bin/pip install --quiet "$wheel"
          cd /tmp
          out="$(/tmp/anima-pypi-smoke/bin/anima-py evaluate --help 2>&1)"
          printf '%s\n' "$out" | grep -q -- '--xbind'
          printf '%s\n' "$out" | grep -q -- '--xfan'
          ! printf '%s\n' "$out" | grep -q -- '--workspace'
      - name: Check version availability
        id: version
        run: |
          ver="$(cat VERSION)"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/anima-python/${ver}/json")"
          [ "$code" = 200 ] && echo "publish=false" >> "$GITHUB_OUTPUT" || echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: ${{ steps.version.outputs.publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist_py
