name: autotag

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: autotag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autotag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create semantic release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          last="$(git tag --list 'v*' --sort=-v:refname | sed -n '1p')"
          [ -n "$last" ] || last=v0.0.0
          range=HEAD
          git rev-parse -q --verify "refs/tags/$last" >/dev/null && range="$last..HEAD"
          subjects="$(git log --format='%s' "$range")"
          bodies="$(git log --format='%s%n%b' "$range")"
          if ! grep -qiE '^(feat|fix|perf)(\([^)]*\))?!?:' <<<"$subjects" \
             && ! grep -q 'BREAKING CHANGE' <<<"$bodies"; then
            echo "No release-worthy commit since $last"
            exit 0
          fi
          IFS=. read -r major minor patch <<<"${last#v}"
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -q 'BREAKING CHANGE' <<<"$bodies"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          next="v${major}.${minor}.${patch}"
          git rev-parse -q --verify "refs/tags/$next" >/dev/null && exit 0
          git tag "$next" "$GITHUB_SHA"
          git push origin "$next"
          gh workflow run release.yml --ref main -f tag="$next"
