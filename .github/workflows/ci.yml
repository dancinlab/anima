# ============================================================================
# CI — Anima hexa-native 파이프라인
# ============================================================================
#
# 2026-04-12: anima/src/ 폐기 → Python packaging/verify-syntax/python-tests/
#             bench-verify/rust-tests 모두 제거. 현재 CI는 CDO JSON 검증만 수행.
#             학습/추론은 hexa-native (PYTHONPATH 불필요).
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cdo-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: CDO validate JSON files
        run: |
          python3 -c "
          import json, os, sys

          SKIP_DIRS = {'.git', 'target', '__pycache__', 'node_modules', 'venv', '.venv', '.claude',
                       'drill_tmp', 'drill_min_20260420',
                       'drill_supplement_tmp', 'drill_domain_tmp', 'state_legacy', 'ready',
                       'state', '.hook-commands', 'references', '.reval_tmp'}
          ok = warn = fail = 0

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
              for f in files:
                  if not f.endswith('.json'):
                      continue
                  path = os.path.join(root, f)
                  try:
                      with open(path) as fh:
                          data = json.load(fh)
                  except (json.JSONDecodeError, UnicodeDecodeError) as e:
                      print(f'FAIL  {path}: {e}')
                      fail += 1
                      continue
                  if not isinstance(data, dict):
                      ok += 1
                      continue
                  if '_meta' in data:
                      ok += 1
                  else:
                      print(f'WARN  {path}: missing _meta field')
                      warn += 1

          print(f'\nCDO validation: {ok} ok, {warn} warn, {fail} fail')
          if fail:
              print('Broken JSON detected — failing CI.')
              sys.exit(1)
          "

  hexa-explicit-main-lint:
    # Block NEW explicit `main()` calls in changed .hexa files.
    # hexa-strict auto-invokes `fn main()`, so a bare top-level `main()` call is a
    # build-fail ("auto-invoke conflict"). Pre-existing files are grandfathered;
    # this gate only fails on files a PR adds/modifies, so the count is monotone-down.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block new explicit main() calls in changed .hexa
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            base="${{ github.event.before }}"
          fi
          changed=$(git diff --name-only --diff-filter=ACM "$base" HEAD -- '*.hexa' || true)
          if [ -z "$changed" ]; then
            echo "no changed .hexa files — skip"
            exit 0
          fi
          # Report bare top-level `main()` lines that are NOT inside a "..." string literal.
          # hexa strings span newlines (codegen templates embed python/shell whose own main()
          # call sits at column 0), so track in-string state across lines, honoring \-escapes.
          scan() {
            awk '
              {
                if (!instr && $0 ~ /^main\(\)[ \t]*$/) { print NR": "$0 }
                n = length($0)
                for (i = 1; i <= n; i++) {
                  c = substr($0, i, 1)
                  if (c == "\\") { i++; continue }
                  if (c == "\"") { instr = !instr }
                }
              }
            ' "$1"
          }
          bad=""
          for f in $changed; do
            [ -f "$f" ] || continue
            if [ -n "$(scan "$f")" ]; then
              bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::explicit main() call(s) found — hexa-strict auto-invokes fn main(), so a bare main() call is a build-fail (auto-invoke conflict)."
            for f in $bad; do
              echo "  --- $f ---"
              scan "$f"
            done
            echo ""
            echo "Fix: delete the trailing bare 'main()' line. fn main() fires automatically under hexa-strict. (a main() inside a string literal is ignored.)"
            exit 1
          fi
          n=$(echo $changed | wc -w | tr -d ' ')
          echo "explicit-main lint: $n changed .hexa file(s) clean"

  # ── Blacksmith Apple-Silicon 빌드 잡 (gamebox-ci 미러) ───────────────────
  # WHY: anima 의 진짜 게이트(엔진 compile + 거버넌스 enforce + 스모크)를 로컬
  # dev Mac 밖 Blacksmith 클라우드 러너로 오프로드 — 로컬은 `git push` 만. macos-15
  # 핀(NOT -26): hexa-lang release.yml 와 동일 SDK 베이스라인. darwin-arm64 선택 =
  # dev 패리티 + x86_64-linux HexaVal tag24 툴체인 벽(ING #10) 회피. hexa 는
  # 릴리즈 바이너리(anima 는 downstream 소비자) — canonical one-liner 설치.
  hexa-engine:
    name: engine compile + gates + smoke (darwin-arm64, Blacksmith)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Compute weekly cache-rotation key
        id: cachekey
        shell: bash
        run: echo "week=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"

      # ── 캐시 ① 의 toolchain (~/.hx) — 이 잡은 install *무결성* 게이트가 아니라
      # engine compile/smoke 게이트라 toolchain 캐시 OK (release.yml install-smoke 와
      # 다름: 거기선 fresh install 가 게이트라 ~/.hx 캐시 금지). 주간 회전 키로
      # hexa-lang 신릴리즈를 1주 내 자동 흡수(태그가 곧 install.sh 가 깔 최신본).
      - name: Cache — hexa toolchain (~/.hx)
        uses: actions/cache@v4
        with:
          path: ~/.hx
          key: hx-toolchain-${{ runner.os }}-${{ runner.arch }}-week-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            hx-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # ── 캐시 ② 의 warm-compile (~/.hexa-cache) — 진짜 병목(엔진 import-closure
      # compile ~12.7min/run 의 aprime_cc codegen). core/** + cli/** 소스 해시로 키 →
      # 엔진 소스 불변이면 hit(컴파일 스킵), 소스 변경이면 정확히 miss(재컴파일). hexa
      # 자체 캐시 해시에 toolchain 바이너리가 섞여 toolchain 변경 시 자연 miss(오염無).
      - name: Cache — hexa warm compile (~/.hexa-cache)
        uses: actions/cache@v4
        with:
          path: ~/.hexa-cache
          key: hexa-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/**', 'cli/**') }}
          restore-keys: |
            hexa-cache-${{ runner.os }}-${{ runner.arch }}-

      # toolchain 설치 + 캐시 VALIDITY 가드 → fresh fallback.
      # 캐시된 ~/.hx 가 stale/broken(잘못된 버전·깨진 바이너리)이면 rm -rf 후
      # canonical fresh curl-install 로 강등(NEVER 잘못된 toolchain 으로 진행).
      # install.sh 는 idempotent — 캐시 hit 면 재확인만, 가드 fail 시 cold 재설치.
      - name: Install hexa toolchain (released binary · cache-validity guarded)
        shell: bash
        run: |
          set -euo pipefail
          fresh_install() {
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/dancinlab/hexa-lang/main/install.sh)"
          }
          probe() {  # hexa run 은 실파일이 필요(process-sub 불가) → temp .hexa
            local td tag="$1"; td="$(mktemp -d)"
            printf 'fn main(){ print("%s") }\n' "$tag" > "$td/probe.hexa"
            local r; r="$("$HOME/.hx/bin/hexa" run "$td/probe.hexa" 2>/dev/null || true)"
            rm -rf "$td"; printf '%s' "$r" | grep -q "$tag"
          }
          fresh_install
          # VALIDITY: 복원된(또는 방금 깐) toolchain 이 실제로 도는지 tiny smoke.
          # 깨졌으면(캐시 corruption) stale ~/.hx + warm-cache 제거 후 fresh 재설치.
          if ! probe "hx_ok"; then
            echo "::warning::cached/installed hexa toolchain failed validity smoke — purging ~/.hx + ~/.hexa-cache, fresh re-install"
            rm -rf "$HOME/.hx" "$HOME/.hexa-cache"
            fresh_install
            probe "hx_ok2" || { echo "::error::fresh hexa toolchain still broken"; exit 1; }
          fi
          echo "$HOME/.hx/bin" >> "$GITHUB_PATH"

      - name: Sanity — hexa runs
        shell: bash
        run: |
          set -euo pipefail
          hexa --version || true
          hexa --help >/dev/null

      # 엔진 compile 게이트 — production import-closure 가 컴파일되는지(syntax/codegen
      # drift 차단). 임시 진입파일을 repo 루트에 두어 "core/…" import 가 해소됨.
      # warm-compile 캐시 STALE 가드 → cold 재컴파일 fallback. GPU_RUNBOOK 의 stale
      # ~/.hexa-cache 트랩(중단된 compile 의 빈/12-byte 바이너리가 캐시히트 → degenerate
      # 출력) 재발 방지: compile 산출이 정상 마커("engine compile OK")가 아니면 해당
      # hexa_run.* 를 rm 후 cold 재컴파일. 캐시는 속도만 바꾸고 정답은 불변.
      - name: Compile gate — production engine import-closure (stale-cache guarded)
        shell: bash
        run: |
          set -euo pipefail
          cat > _ci_engine_compile.hexa <<'HX'
          import "core/clm_decode.hexa"
          import "core/bytegpt_decode.hexa"
          import "core/generator.hexa"
          import "core/g_gates.hexa"
          import "core/g6_ideation.hexa"
          import "core/engine_cli.hexa"
          fn main() { print("engine compile OK") }
          HX
          out="$(hexa run _ci_engine_compile.hexa 2>&1 || true)"
          if ! printf '%s' "$out" | grep -q "engine compile OK"; then
            echo "::warning::engine compile produced degenerate output (stale ~/.hexa-cache trap) — purging warm cache + cold recompile"
            printf '%s\n' "$out" | tail -20
            rm -f "$HOME"/.hexa-cache/hexa_run.* 2>/dev/null || true
            out="$(hexa run _ci_engine_compile.hexa 2>&1)"
            printf '%s' "$out" | grep -q "engine compile OK" \
              || { echo "::error::engine import-closure compile FAILED even after cold recompile"; printf '%s\n' "$out" | tail -40; rm -f _ci_engine_compile.hexa; exit 1; }
          fi
          printf '%s\n' "$out"
          rm -f _ci_engine_compile.hexa

      # 거버넌스 enforce (CLAUDE.md 하드게이트 1·6 의 기계강제 — engine-native verdict
      # · 가설 2표면). python 만 필요, 가중치 불필요.
      - name: Governance — enforce_anima_gates (changed)
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/enforce_anima_gates.py || { echo "::error::enforce_anima_gates FAIL"; exit 1; }

      # 엔진 스모크 — 가중치 없이 compile+logic 도는 것들. 가중치/플랫폼 의존(tag24·
      # .clm 부재)은 warn-only(정직, CI 거짓-red 방지). hexa stable 에 따라 가변.
      - name: Smoke — weight-free engine smokes (warn-only)
        shell: bash
        run: |
          set -uo pipefail
          for s in core/brain_smoke.hexa core/emit_policy_smoke.hexa \
                   core/g_gates_smoke.hexa core/generator_smoke.hexa \
                   core/bytegpt_kvcache_smoke.hexa ; do
            echo "── $s ──"
            hexa run "$s" || echo "::warning::$s non-zero (weight/platform-dep warn-only)"
          done

      # 실제 anima CLI 바이너리 설치 (배포 산출물 그 자체 = 권위 평가 진입점). 로컬 체크아웃의
      # cli/anima.hexa 를 `anima` 로 install → parity_gate 가 `anima eval` 로 측정(소스-run 아님).
      # best-effort: 실패해도 parity_gate 가 hexa-run-source 로 fallback(둘 다 동일 단일진입).
      - name: Install local anima CLI (real production binary)
        shell: bash
        run: |
          set -uo pipefail
          hx install . 2>/dev/null || hexa install 2>/dev/null \
            || echo "::warning::local anima CLI install skipped — parity_gate falls back to source-run"
          command -v anima >/dev/null && { echo "anima on PATH:"; anima --version || true; } || true

      # 2-PRODUCTION LOCKSTEP — code-level 강제: golden d768(303M OOM 없는 작은 ckpt)을
      # 실제 anima CLI 단일진입(`anima eval`, 없으면 hexa run cli/anima.hexa fallback) vs
      # py 엔진(core/g_gates.py) 으로 돌려 G0-G6 byte-동일 강제. drift = CI red = 머지 차단
      # (a_engine_native_learning). 권위 평가 = 실제 anima CLI ONLY; py 는 이 게이트로 CLI 와
      # 동일 보장되는 미러일 뿐. golden ckpt 없으면 LOUD warn-skip(parity_gate 자체 처리).
      - name: Parity gate — anima CLI ⇄ py G0-G6 byte-parity (golden)
        shell: bash
        run: |
          set -uo pipefail
          python3 tool/parity_gate.py
