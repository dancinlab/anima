name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-runtime:
    name: Python runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[train,runtime,test]"
      - name: Test
        run: >-
          python -m pytest -q
          tests
          cli/test_train_import_resolution.py
          agent/domains/CHAT/test_broker_reply_correlation.py
          agent/domains/CHAT/test_participant_conversation.py
          agent/domains/CHAT/test_python_runtime_replacements.py
          agent/domains/CHAT/test_substrate_clm.py
      - name: Installed CLI smoke
        run: |
          anima-py --help
          anima-py evaluate --help

  cdo-validate:
    name: JSON validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON files
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          skipped = {
              '.git', 'target', '__pycache__', 'node_modules', 'venv', '.venv',
              '.claude', 'state_legacy', 'ready', 'state', 'archive', 'references',
              'drill_tmp', 'drill_min_20260420', 'drill_supplement_tmp',
              'drill_domain_tmp', '.hook-commands', '.reval_tmp',
          }
          failures = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [name for name in dirs if name not in skipped]
              for name in files:
                  if not name.endswith('.json'):
                      continue
                  path = os.path.join(root, name)
                  if os.path.islink(path):
                      continue
                  try:
                      with open(path, encoding='utf-8') as handle:
                          json.load(handle)
                  except (json.JSONDecodeError, UnicodeDecodeError) as exc:
                      failures.append(f'{path}: {exc}')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('JSON validation passed')
          PY
