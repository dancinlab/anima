# ============================================================================
# CI — Anima hexa-native 파이프라인
# ============================================================================
#
# 2026-04-12: anima/src/ 폐기 → Python packaging/verify-syntax/python-tests/
#             bench-verify/rust-tests 모두 제거. 현재 CI는 CDO JSON 검증만 수행.
#             학습/추론은 hexa-native (PYTHONPATH 불필요).
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 수동 트리거 (hexa-lang 게이트들과 동일) — 커밋 없이 cold 재측정/profile 수확
  # run 을 만들 수 있다 (2026-07-03 profile 사냥에서 부재가 실통증이었음).
  workflow_dispatch:

# Cancel superseded runs of the same ref (a rapid push/PR series otherwise piles up
# many duplicate github-hosted macOS jobs against the scarce macOS runner pool — the
# real cause of the runaway "queued" backlog). main runs are never cancelled.
# main 은 per-commit 그룹 — 측정(2026-07-03): per-ref 그룹은 PENDING 1개만 허용해
# 40-90min engine run 이 그룹을 쥔 동안 중간 main push 들이 잡 0개로 취소됐다
# (24h 에 main-push 77/92 취소·main 검증 지연 93min+ 무한). per-commit 그룹이면
# 30-40s ubuntu 게이트(governance/cdo/lint)가 모든 머지 커밋에서 항상 돈다.
# engine 폭주는 아래 hexa-engine 잡-레벨 per-ref keep-latest 가 별도 직렬화.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── dispatch — fallback-dispatch runner picker (free · always available) ─────
  # Probes whether ghost-anima (darwin arm64, selfhost-gen2fix slot) is ONLINE
  # and emits the hexa-engine job's `runs-on` at runtime: ghost when online +
  # same-repo (fast — always-warm ~/.hexa-cache), else the mini-anima insurance
  # runner (hexa-darwin-mini, ghost-offline ONLY), else the free github-hosted
  # macos-14 fallback. Ghost-offline (or a fork PR) therefore NEVER wedges the
  # engine gate — it just falls back. Ports dancinlab/hexa-lang 1:1
  # (tool/ci_pick_runner.sh · .github/actions/pick-runner · PR #4417/#4023).
  dispatch:
    name: dispatch (pick runner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      darwin_label: ${{ steps.darwin.outputs.label }}
      engine_needed: ${{ steps.paths.outputs.engine_needed }}
    steps:
      - uses: actions/checkout@v4
      # ── 경로 게이트 (hexa-lang 게이트별 paths: 패턴의 잡-레벨 이식) ──
      # engine 잡의 입력은 컴파일 closure(core/·cli/·stdlib/)와 잡 정의 자신뿐.
      # docs/state/HYPOTHESES-only 변경(오늘 머지의 대부분)에 ghost 직렬 러너의
      # cold ~25-49min 을 태우는 것이 CI 최대 낭비였다. 변경 파일은 checkout 없이
      # GitHub API 로 조회(PR=pulls/files · push=compare before...after). 조회
      # 실패·초기push 등 불확실하면 1 (fail-open = 게이트를 도는 안전 방향).
      # 거버넌스 enforce 는 아래 별도 ubuntu 잡으로 분리되어 스킵과 무관하게
      # 항상 돈다(게이트 무약화).
      - id: paths
        name: engine path gate (closure inputs changed?)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          needed=1
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename' 2>/dev/null)" || files=""
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              files="$(gh api "repos/${{ github.repository }}/compare/${BEFORE}...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null)" || files=""
            fi
          fi
          if [ -n "$files" ]; then
            if printf '%s\n' "$files" | grep -qE '^(core/|cli/|stdlib/|hexa\.toml|install\.hexa|setup\.hexa|\.github/workflows/ci\.yml)'; then
              needed=1
            else
              needed=0
              echo "engine path gate: no closure-input change — engine job will be SKIPPED"
              printf '%s\n' "$files" | head -20
            fi
          else
            echo "engine path gate: changed-file list unavailable — fail-open (run the engine job)"
          fi
          # zombie guard — head 브랜치 PR 이 이미 MERGED 면 이 run 의 engine 은
          # 아무것도 보호하지 않는다 (측정: 머지-완료 브랜치의 대기 run 9개가
          # darwin 슬롯 ~180-300min/일 점유). 조회 실패 = fail-open (기존 needed 유지).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            merged="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.merged' 2>/dev/null)" || merged=""
            if [ "$merged" = "true" ]; then
              needed=0
              echo "engine path gate: PR already MERGED — zombie run, engine job SKIPPED"
            fi
          fi
          echo "engine_needed=$needed" >> "$GITHUB_OUTPUT"
      - id: darwin
        uses: ./.github/actions/pick-runner
        with:
          kind: darwin
          # self-hosted only for same-repo events; fork PRs → GitHub-hosted (RCE).
          eligible: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
          # administration:read PAT (self-hosted runners list needs it; the
          # default github.token CANNOT carry that scope → empty list → blind
          # fallback). Absent secret → `|| github.token` = harmless macos-14
          # fallback; present → self-hosted routing goes live.
          token: ${{ secrets.RUNNER_PROBE_TOKEN || github.token }}

  # ── 거버넌스 enforce (CLAUDE.md 하드게이트 1·6 의 기계강제 — engine-native
  # verdict · 가설 2표면 · G5 VERSION lockstep). python 만 필요, 가중치 불필요.
  # hexa-engine 잡에서 분리(2026-07-03): engine 잡이 경로 게이트로 스킵되는
  # docs/state-only 변경이 바로 이 enforcer 의 주 대상이므로, 항상 도는 ubuntu
  # 잡이어야 게이트가 안 뚫린다.
  governance:
    name: governance — enforce_anima_gates (changed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — enforce_anima_gates.py 의 changed_slugs()/changed_files()
      # 가 `git merge-base HEAD origin/main` 로 diff 범위를 잡는다(G1·G5). 기본
      # depth=1 얕은 checkout 이면 origin/main 이 안 잡혀 base="" → diff 범위가
      # staged/unstaged(빈 checkout 에선 항상 공집합)로 쪼그라들어 게이트가
      # 조용히 vacuous-pass 된다 — full history 로 실제 PR diff 를 보게 한다
      # (hexa-explicit-main-lint 잡이 이미 쓰는 동일 패턴).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: enforce_anima_gates
        shell: bash
        run: |
          set -euo pipefail
          python3 .harness/enforce_anima_gates.py || { echo "::error::enforce_anima_gates FAIL"; exit 1; }

  cdo-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: CDO validate JSON files
        run: |
          python3 -c "
          import json, os, sys

          SKIP_DIRS = {'.git', 'target', '__pycache__', 'node_modules', 'venv', '.venv', '.claude',
                       'drill_tmp', 'drill_min_20260420',
                       'drill_supplement_tmp', 'drill_domain_tmp', 'state_legacy', 'ready',
                       'state', '.hook-commands', 'references', '.reval_tmp'}
          ok = warn = fail = 0

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
              for f in files:
                  if not f.endswith('.json'):
                      continue
                  path = os.path.join(root, f)
                  try:
                      with open(path) as fh:
                          data = json.load(fh)
                  except (json.JSONDecodeError, UnicodeDecodeError) as e:
                      print(f'FAIL  {path}: {e}')
                      fail += 1
                      continue
                  if not isinstance(data, dict):
                      ok += 1
                      continue
                  if '_meta' in data:
                      ok += 1
                  else:
                      print(f'WARN  {path}: missing _meta field')
                      warn += 1

          print(f'\nCDO validation: {ok} ok, {warn} warn, {fail} fail')
          if fail:
              print('Broken JSON detected — failing CI.')
              sys.exit(1)
          "

  hexa-explicit-main-lint:
    # Block NEW explicit `main()` calls in changed .hexa files.
    # hexa-strict auto-invokes `fn main()`, so a bare top-level `main()` call is a
    # build-fail ("auto-invoke conflict"). Pre-existing files are grandfathered;
    # this gate only fails on files a PR adds/modifies, so the count is monotone-down.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block new explicit main() calls in changed .hexa
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            base="${{ github.event.before }}"
          fi
          changed=$(git diff --name-only --diff-filter=ACM "$base" HEAD -- '*.hexa' || true)
          if [ -z "$changed" ]; then
            echo "no changed .hexa files — skip"
            exit 0
          fi
          # Report bare top-level `main()` lines that are NOT inside a "..." string literal.
          # hexa strings span newlines (codegen templates embed python/shell whose own main()
          # call sits at column 0), so track in-string state across lines, honoring \-escapes.
          scan() {
            awk '
              {
                if (!instr && $0 ~ /^main\(\)[ \t]*$/) { print NR": "$0 }
                n = length($0)
                for (i = 1; i <= n; i++) {
                  c = substr($0, i, 1)
                  if (c == "\\") { i++; continue }
                  if (c == "\"") { instr = !instr }
                }
              }
            ' "$1"
          }
          bad=""
          for f in $changed; do
            [ -f "$f" ] || continue
            if [ -n "$(scan "$f")" ]; then
              bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::explicit main() call(s) found — hexa-strict auto-invokes fn main(), so a bare main() call is a build-fail (auto-invoke conflict)."
            for f in $bad; do
              echo "  --- $f ---"
              scan "$f"
            done
            echo ""
            echo "Fix: delete the trailing bare 'main()' line. fn main() fires automatically under hexa-strict. (a main() inside a string literal is ignored.)"
            exit 1
          fi
          n=$(echo $changed | wc -w | tr -d ' ')
          echo "explicit-main lint: $n changed .hexa file(s) clean"

  # ── Apple-Silicon 엔진 빌드 잡 (github-hosted darwin-arm64) ───────────────
  # WHY: anima 의 진짜 게이트(엔진 compile + 거버넌스 enforce + 스모크)를 로컬
  # dev Mac 밖 github-hosted macOS 러너로 오프로드 — 로컬은 `git push` 만.
  # (2026-06-26 Blacksmith 러너 은퇴 → github-hosted, 오너 비용 지시; 러너 이름은
  # 살아있는 러너를 반영해 명명한다.) darwin-arm64 선택 = dev 패리티 +
  # x86_64-linux HexaVal tag24 툴체인 벽(ING #10) 회피 — 그래서 linux ubuntu 잡으로
  # 대체 불가. runner=macos-14: github-hosted 표준 arm64 이미지 중 가용성이 가장
  # 넓다(2026-07-02 macos-15 이미지 풀이 12h+ 프로비저닝 정체 → 마이그레이션).
  # hexa 는 릴리즈 바이너리를 curl-설치 후 실행할 뿐이라(빌드 아님) macOS SDK 버전과
  # 무관 — anima 는 downstream 소비자, canonical one-liner 설치.
  hexa-engine:
    name: engine compile + gates + smoke (darwin-arm64)
    # runs-on picked at runtime by the dispatch job: ghost-anima (self-hosted,
    # fast) when online + same-repo, else mini-anima insurance, else macos-14
    # github-hosted. The picker never hard-depends on the pool (dispatch runs on
    # ubuntu-latest, always available) so ghost-offline can't wedge this gate.
    needs: dispatch
    # 경로 게이트: closure 입력(core/·cli/·stdlib/·hexa.toml·install/setup.hexa·
    # 이 워크플로)이 안 바뀐 run 은 스킵 — docs/state-only 머지가 ghost 직렬
    # 러너를 점유하지 않는다. 판정 로직·fail-open 은 dispatch 의 paths 스텝 참조.
    if: needs.dispatch.outputs.engine_needed == '1'
    runs-on: ${{ fromJSON(needs.dispatch.outputs.darwin_label) }}
    # 25→50→75: 첫 COLD 부트스트랩 run 은 warm-compile 캐시가 비어 compile-gate
    # + cli/anima install 만으로 예산을 소진 → 타임아웃에 cancel → Post-Cache save
    # 스킵 → 캐시가 영원히 안 데워지는 chicken-egg(매 run COLD·만성 타임아웃). 캐시는
    # 브랜치-스코프라 main 머지 후 main 의 첫 COLD run 이 timeout 안에 *완료*돼야 save→
    # 이후 warm run 은 초 단위. 75 로 올린 근거(실측 2026-07-03): v0.59x cold gate 가
    # 48m49s 에서 50min 캡에 잘려 cancel(run 28651287277) → save 스킵 → 연쇄 cold 재발.
    # 75min = 그 실측 cold + install/smoke 여유. warm 정상 run 엔 무해.
    timeout-minutes: 75
    # per-ref keep-latest — main 이 per-commit 그룹이 된 대신 engine 은 여기서
    # 직렬화: 그룹당 in-flight 1 + pending 1, 새 pending 이 옛 pending 을 교체
    # (최신 SHA 만 검증 — main engine 검증의 의도와 일치 · in-flight 는 불가침).
    concurrency:
      group: ci-engine-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # ~/.hx 툴체인 캐시는 폐지(2026-07-03): 주간키 stale-pin(v0.588 종일 고착 →
      # 계측 미탑재+x86 타깃 오발사 게이트 붕괴)과 태그키↔installable 불일치 재설치
      # 처닝까지, 캐시가 만든 함정 클래스 대비 fresh install 실측 ~25s 는 공짜다.
      # 매 run canonical install.sh 신규 설치 = 항상 Latest 와 일치.
      # toolchain 설치 + 캐시 VALIDITY 가드 → fresh fallback.
      # 캐시된 ~/.hx 가 stale/broken(잘못된 버전·깨진 바이너리)이면 rm -rf 후
      # canonical fresh curl-install 로 강등(NEVER 잘못된 toolchain 으로 진행).
      # install.sh 는 idempotent — 캐시 hit 면 재확인만, 가드 fail 시 cold 재설치.
      - name: Install hexa toolchain (released binary · cache-validity guarded)
        shell: bash
        run: |
          set -euo pipefail
          fresh_install() {
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/dancinlab/hexa-lang/main/install.sh)"
          }
          probe() {  # hexa run 은 실파일이 필요(process-sub 불가) → temp .hexa
            local td tag="$1"; td="$(mktemp -d)"
            printf 'fn main(){ print("%s") }\n' "$tag" > "$td/probe.hexa"
            local r; r="$("$HOME/.hx/bin/hexa" run "$td/probe.hexa" 2>/dev/null || true)"
            rm -rf "$td"; printf '%s' "$r" | grep -q "$tag"
          }
          rm -rf "$HOME/.hx"   # 항상 신규 설치(위 캐시 폐지 주석 참조)
          fresh_install
          # VALIDITY: 복원된(또는 방금 깐) toolchain 이 실제로 도는지 tiny smoke.
          # 깨졌으면(캐시 corruption) stale ~/.hx + warm-cache 제거 후 fresh 재설치.
          if ! probe "hx_ok"; then
            echo "::warning::cached/installed hexa toolchain failed validity smoke — purging ~/.hx + ~/.hexa-cache, fresh re-install"
            rm -rf "$HOME/.hx" "$HOME/.hexa-cache"
            fresh_install
            probe "hx_ok2" || { echo "::error::fresh hexa toolchain still broken"; exit 1; }
          fi
          echo "$HOME/.hx/bin" >> "$GITHUB_PATH"

      - name: Sanity — hexa runs
        shell: bash
        run: |
          set -euo pipefail
          hexa --version || true
          hexa --help >/dev/null

      # 설치된 toolchain 의 실버전을 캐시 키 재료로 캡처 (아래 캐시 ② 참조).
      - name: Capture hexa version (warm-cache key)
        id: hxver
        shell: bash
        run: echo "v=$(hexa --version 2>/dev/null | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      # ── 캐시 ② 의 warm-compile (~/.hexa-cache) — 진짜 병목(엔진 import-closure
      # compile ~12.7min/run, 실측 2026-07-03: aprime_cc codegen ~85% vs clang ~15%
      # 116s). 키 = hexa 실버전 + core/**·cli/** 소스 해시. 버전을 키에 넣는 이유
      # (실측 결함): ~/.hexa-cache 엔트리는 버전 접미(hexa_run.<hash>_vX.Y.Z)라 옛
      # 버전 엔트리는 절대 오용되지 않지만(정합 OK), actions/cache 는 exact-key hit
      # 이면 Post 단계에서 재저장을 안 한다 — 그래서 소스 불변 + toolchain bump 조합
      # 에서 "옛 버전 캐시 exact-hit 복원 → 전부 무용 → cold 컴파일 → 재저장 스킵"
      # 이 소스가 바뀔 때까지 매 run 반복되는 영구-cold 함정이 있었다. 버전이 키에
      # 들어가면 bump 첫 run 이 miss → cold 1회 → save 되어 이후 warm. 이 캐시 스텝이
      # install 뒤에 오는 이유 = 설치된 실버전(hexa --version)을 키로 쓰기 위함
      # (설치 전엔 버전을 알 수 없음; restore 는 스텝 위치, save 는 잡 끝 Post 에서).
      # ⚠️ `!core/phi/quantum_types.hexa` 제외 필수 — 이건 hexa-lang sibling repo 의
      # `../../hexa-lang/self/quantum_types.hexa` 로 가는 *외부 의존* symlink 라 CI
      # 체크아웃(단독 클론)에선 dangling. GitHub 의 hashFiles() 표현식은 runner 가
      # followSymbolicLinks=false 로 호출하므로(actions/runner hashFiles.ts) dangling
      # symlink 를 stat 하다 ENOENT → "Fail to hash files under directory" 로 전체
      # 키 평가가 fatal 실패 → 캐시 스텝 RED(매 run 만성 실패의 실근거). 이 파일은
      # anima 가 소유하지 않는 외부 소스라 엔진-소스 fingerprint 에 애초에 불포함이
      # 정답(캐시 무효화 의미 불변). 글로브 `!` 제외로 stat 자체를 회피한다.
      # restore-keys 도 버전 스코프 — 옛 버전 dead-weight 복원을 차단한다.
      - name: Cache — hexa warm compile (~/.hexa-cache)
        uses: actions/cache@v4
        with:
          path: ~/.hexa-cache
          key: hexa-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.hxver.outputs.v }}-${{ hashFiles('core/**', 'cli/**', '!core/phi/quantum_types.hexa') }}
          restore-keys: |
            hexa-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.hxver.outputs.v }}-

      # 엔진 compile 게이트 — production import-closure 가 컴파일되는지(syntax/codegen
      # drift 차단). 임시 진입파일을 repo 루트에 두어 "core/…" import 가 해소됨.
      # warm-compile 캐시 STALE 가드 → cold 재컴파일 fallback. GPU_RUNBOOK 의 stale
      # ~/.hexa-cache 트랩(중단된 compile 의 빈/12-byte 바이너리가 캐시히트 → degenerate
      # 출력) 재발 방지: compile 산출이 정상 마커("engine compile OK")가 아니면 해당
      # hexa_run.* 를 rm 후 cold 재컴파일. 캐시는 속도만 바꾸고 정답은 불변.
      #
      # HEXA_STREAM=1 (2026-07-03 · 라운드4 실측 레버) — 이 게이트는 quiet native
      # aprime 경로를 타며(출력에 [1/2]/[rt] 마커 無 실측) cold 26m55s (v0.586.0,
      # run 28644656962 step9). aprime 의 non-stream 경로는 whole-TU MIR+LIR 를
      # 통째로 상주시켜 25k라인 closure 에서 10-16GB RSS 급의 메모리 병목
      # (hexa-lang PLAN-stage3-footprint 문서화). --stream 은 arm64-apple-darwin
      # 전용 per-function fused lower/codegen/emit 로 그 상주를 제거한다. 이 잡의
      # 러너 체인(ghost→mini→macos-15)은 전부 darwin-arm64 라 전 체인 적용 가능.
      # opt 는 default 0(const_fold/dce/inline 이미 전부 스킵)이라 stream 이 끄는
      # 최적화는 없음 — 게이트 의미(컴파일 성공 + 마커 출력) 불변. A/B 실측:
      # 26m55s(stream OFF·v0.586.0) → 24m36s(stream ON·v0.586.1, run 28646394898)
      # = ~9%, 마이너. 잔여 ~24min 은 aprime pass 자체의 CPU 비용.
      # HEXA_CG_PROFILE=1 — aprime 단계별 wall-clock(lower_hir/mir_opt/codegen/
      # emit) 을 stderr 로 출력하는 업스트림 진단 플래그. 게이트가 2>&1 로 캡처해
      # 마지막에 printf 하므로 CI 로그에서 단계 분해가 그대로 보인다. 상시 계측:
      # warm-hit run 은 컴파일 자체를 스킵하므로 비용·로그 0, cold compile(core/
      # cli 변경 또는 toolchain bump 후 첫 run)마다 자동으로 단계 분해가 남는다.
      # 어느 pass 가 ~24min 을 먹는지 확정되면 그 pass 를 업스트림에서 조준(라운드5).
      - name: Compile gate — production engine import-closure (stale-cache guarded)
        shell: bash
        env:
          HEXA_STREAM: '1'
          HEXA_CG_PROFILE: '1'
        run: |
          set -euo pipefail
          cat > _ci_engine_compile.hexa <<'HX'
          import "core/decode.hexa"  // unified CONV(CLM)+BYTE(ByteGPT) decoder (merged from former core/clm_decode.hexa + core/bytegpt_decode.hexa)
          import "core/generator.hexa"
          import "cli/evaluate.hexa"  // former core/g_gates.hexa (G0–G6 scorers) absorbed here
          import "core/rho_fan.hexa"
          import "core/engine_cli.hexa"
          fn main() { print("engine compile OK") }
          HX
          # 출력은 tee 로 LIVE 스트리밍 — capture-then-print 는 타임아웃 cancel 시
          # 로그를 통째로 유실했다(실측 run 28651287277: 48m49s cancel → CG_PROFILE
          # 행 전부 소실). tee /dev/stderr 는 가드용 캡처($out)를 유지하면서 행이
          # 방출되는 즉시 잡 로그에 남긴다(취소 내성 + 진행 관찰 가능).
          out="$(hexa run _ci_engine_compile.hexa 2>&1 | tee /dev/stderr || true)"
          if ! printf '%s' "$out" | grep -q "engine compile OK"; then
            echo "::warning::engine compile produced degenerate output (stale ~/.hexa-cache trap) — purging warm cache + cold recompile"
            rm -f "$HOME"/.hexa-cache/hexa_run.* 2>/dev/null || true
            out="$(hexa run _ci_engine_compile.hexa 2>&1 | tee /dev/stderr)"
            printf '%s' "$out" | grep -q "engine compile OK" \
              || { echo "::error::engine import-closure compile FAILED even after cold recompile"; rm -f _ci_engine_compile.hexa; exit 1; }
          fi
          rm -f _ci_engine_compile.hexa

      # 엔진 스모크 — 가중치 없이 compile+logic 도는 것들. 가중치/플랫폼 의존(tag24·
      # .clm 부재)은 warn-only(정직, CI 거짓-red 방지). hexa stable 에 따라 가변.
      # warn-only 라 실패/시간초과로 잡을 RED 시키면 안 됨 — COLD 일 때 스모크 4개의
      # cold-compile 가 잡 타임아웃을 잡아먹어 Post-Cache save 를 막던 주범.
      # 실측(2026-07-03): GREEN 런 5/5 에서 이 step 이 12m12–13s = timeout-minutes 캡을
      # 매번 정확히 치고 잘리고 있었음(직렬 러너에서 매 PR 12분 소모). → per-smoke
      # 180s 캡 + fail-fast: 첫 스모크가 캡을 치면(=cold cache) 나머지도 cold 라 정보값
      # 0 이므로 SKIP. 최악 wall ~3분. step timeout-minutes 는 벨트로 유지 →
      # 잡은 항상 다음 step + Post-Cache save 까지 도달. 각 스모크 wall time 을 echo
      # 해 다음 측정 가능. (timeout 바이너리 부재 대비 perl alarm+exec 폴백 포함.)
      - name: Smoke — weight-free engine smokes (warn-only)
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: |
          set -uo pipefail
          SMOKE_TIMEOUT=180
          run_capped() {  # run_capped <secs> <cmd...> — GNU timeout > gtimeout > perl-alarm
            local secs="$1"; shift
            if command -v timeout >/dev/null 2>&1; then timeout "$secs" "$@"
            elif command -v gtimeout >/dev/null 2>&1; then gtimeout "$secs" "$@"
            else perl -e 'alarm shift; exec @ARGV or die "exec: $!"' "$secs" "$@"
            fi
          }
          timed_out=0
          for s in core/brain_smoke.hexa core/emit_policy_smoke.hexa \
                   core/generator_smoke.hexa \
                   core/bytegpt_kvcache_smoke.hexa ; do
            if [ "$timed_out" = 1 ]; then
              echo "::warning::$s SKIPPED — earlier smoke hit the ${SMOKE_TIMEOUT}s per-smoke cap (cold cache ⇒ this one would also be cold; info value 0)"
              continue
            fi
            echo "── $s ──"
            t0=$SECONDS
            run_capped "$SMOKE_TIMEOUT" hexa run "$s"; rc=$?
            dt=$(( SECONDS - t0 ))
            # timeout 판정은 rc 가 아니라 경과시간으로 (구현별 rc 상이: GNU 124 ·
            # perl-alarm 142 · 일부 shim 143) — 실패 + dt≥캡 = 캡히트.
            if [ "$rc" -ne 0 ] && [ "$dt" -ge "$SMOKE_TIMEOUT" ]; then
              echo "::warning::$s TIMEOUT at ${dt}s (per-smoke cap ${SMOKE_TIMEOUT}s) — fail-fast, skipping remaining smokes"
              timed_out=1
            elif [ "$rc" -ne 0 ]; then
              echo "::warning::$s non-zero rc=$rc in ${dt}s (weight/platform-dep warn-only)"
            else
              echo "$s OK in ${dt}s"
            fi
          done

      # 실제 anima CLI 바이너리 설치 (배포 산출물 그 자체 = 권위 평가 진입점). 로컬 체크아웃의
      # cli/anima.hexa 를 `anima` 로 install → 권위 평가는 이 단일진입(`anima eval`)으로만.
      - name: Install local anima CLI (real production binary)
        shell: bash
        run: |
          set -uo pipefail
          hx install . 2>/dev/null || hexa install 2>/dev/null \
            || echo "::warning::local anima CLI install skipped"
          command -v anima >/dev/null && { echo "anima on PATH:"; anima --version || true; } || true

      # NOTE (2026-06-28): hexa⇄py byte-parity gate (tool/parity_gate.py) RETIRED — py engine
      # fully retired (hexa-단일 production). 권위 평가 = 실제 anima CLI 단일진입(`anima eval`)
      # ONLY (a_engine_native_learning). retired tool 보존 = state/py_retire_archive/defunct_parity_tooling/.
