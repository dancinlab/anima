name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-release:
    name: Python package and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify package
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist_py
          python -m twine check dist_py/*
          python -m venv /tmp/anima-release-smoke
          wheel="$(find "$PWD/dist_py" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          [ -n "$wheel" ]
          /tmp/anima-release-smoke/bin/pip install --quiet "$wheel"
          cd /tmp
          /tmp/anima-release-smoke/bin/anima-py --help
      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          [ -n "$tag" ] || tag="$GITHUB_REF_NAME"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 - "$tag" > /tmp/notes.md <<'PY'
          import json
          import sys

          tag = sys.argv[1]
          try:
              with open('CHANGELOG.jsonl', encoding='utf-8') as handle:
                  entries = [json.loads(line) for line in handle if line.strip()]
              latest = entries[-1]
              title = latest.get('title', '').strip()
              body = latest.get('body', '').strip()
              print((f'## {title}\n\n{body}').strip())
          except Exception:
              print(f'anima release {tag}')
          PY
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "anima $tag" --notes-file /tmp/notes.md
          else
            gh release create "$tag" --title "anima $tag" --notes-file /tmp/notes.md --verify-tag
          fi
