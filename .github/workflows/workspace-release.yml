name: Workspace release gate

on:
  pull_request:
    paths:
      - "core/workspace_*.py"
      - "cli/chat.py"
      - "cli/evaluate.py"
      - "tests/test_cognitive_workspace.py"
      - ".github/workflows/workspace-release.yml"
  push:
    branches: [main]
    paths:
      - "core/workspace_*.py"
      - "cli/chat.py"
      - "cli/evaluate.py"
      - "tests/test_cognitive_workspace.py"
      - ".github/workflows/workspace-release.yml"
  workflow_dispatch:

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical Python CLI
        run: python3 -m pip install .
      - name: Workspace unit and release-verifier controls
        run: python3 -m unittest tests.test_cognitive_workspace
      - name: Exact semantic certification
        run: anima-py evaluate --workspace-semantic
      - name: 500-tick logic/state soak
        run: anima-py evaluate --workspace-longrun --ticks 500
