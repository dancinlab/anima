    semantic_equivalence: PASS  # base 와 같은 axis 의미 보존 (manual review pass)
    proxy_gaming_check: PASS    # paraphrase 가 self-ref intensity 인위 증폭 X
    d1_scope_clamp: PASS        # 모든 paraphrase anima self-ref boundary within
    own_14_anti_goodhart: PASS  # V14 strict 정합
