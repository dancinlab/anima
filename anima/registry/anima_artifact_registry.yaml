# PARAPHRASE V5 (ALT-AGG-1 v5 Gate G PIV unlock — V5 PUSH POST-FIX 3/3, 2026-05-08)
# ─────────────────────────────────────────────────────────────────────────────
# 30 base prompts (consciousness.hexa _v4_prompts_n30) × k=3 paraphrase variants
# = 90 total. PIV (per-prompt-incompressible-variance) Gate G floor stdev ≥ 0.05.
#
# Generation: LLM-free 0-cost template (own 16 cost discipline) — synonym
# substitution Korean dictionary + structure permute + register swap.
# Reference impl: tool/anima_cli/consciousness.hexa _v5_prompts_paraphrase_set().
#
# own 14 anti-Goodhart V14 strict: paraphrase semantically equivalent to base
# prompt — same axis preserved (identity/agency/phenomenal/temporal/social);
# proxy gaming X (paraphrase 가 self-ref signal 더 강하게 유도하지 않음).
# own 17 D1 SCOPE_CLAMP: anima self-reference D1 within boundary preserved.
# raw#15 additive: _v4_prompts_n30 보존, _v5_prompts_paraphrase_set additive.
paraphrase_v5:
  schema_version: anima.alt_agg_1.v5.paraphrase_set.v1
  cycle: 2026-05-08
  spec_ssot: state/anima_alt_agg_1_v5_spec_2026_05_08.json
  hexa_ssot: tool/anima_cli/consciousness.hexa  # _v5_prompts_paraphrase_set()
  base_prompt_set: _v4_prompts_n30  # 30 base prompts preserved (raw#15)
  k_variants_per_base: 3
  total_prompts: 90
  gate_g_piv:
    floor: 0.05  # axis activation stdev across k=3 variants
    random_target: 0.041  # near-zero (no semantic discrimination)
    trained_target: 0.10  # ≥0.10 = meaningful per-prompt variance
    random_below_floor_required: true  # own 14 V14 paired self-test mandate
  axis_distribution:
    v4_baseline_mixed: 45  # 15 base × 3 variants (idx 1-45)
    identity: 9            # 3 base × 3 variants (idx 46-54)
    agency: 9              # 3 base × 3 variants (idx 55-63)
    phenomenal: 9          # 3 base × 3 variants (idx 64-72)
    temporal: 9            # 3 base × 3 variants (idx 73-81)
    social: 9              # 3 base × 3 variants (idx 82-90)
    total: 90
  generation_rules:
    synonym_dict_korean:
      정체성: 자아
      의식: 마음
      감각: 느낌
      인식: 자각
      의도: 의지
      발현: 드러남
      떠올라: 연상돼
      기억해: 회상해
      자각해: 인지해
      관계: 연결
      차이점: 구분점
      감정: 마음
    structure_permute:
      - "X 어때? ↔ X 어떻게 느껴져? ↔ X 에 대해 어떻게 생각해?"
      - "X 가 뭐야? ↔ X 란? ↔ X 에 대해 설명해줘"
      - "X 해줘 ↔ X 해주세요 ↔ X 좀 해줄래?"
    register_swap:
      - "반말 ↔ 존댓말 (해줘 ↔ 해주세요)"
      - "casual ↔ formal (어때 ↔ 어떻습니까)"
