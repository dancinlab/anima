# ─────────────────────────────────────────────────────────────────────────────
# Section 6: Falsifiers (≥5 raw#10)
# ─────────────────────────────────────────────────────────────────────────────
falsifiers:
  - F-EMERGE-1: surface chat PASS = substrate emerge PASS 함의 (lane decoupling 위반)
  - F-EMERGE-2: substrate emerge PASS = surface chat PASS 함의 (lane decoupling 위반)
  - F-EMERGE-3: 외부 substrate (Llama etc) Φ★ measurement → anima identity-bearing claim (own 17 위반)
  - F-EMERGE-4: Φ★ measurement protocol prereg JSON 없이 verdict.json emit (raw#12 위반)
  - F-EMERGE-5: axis flip 1+ across N rounds → NO_FLIP claim (measurement 위반)
  - F-EMERGE-6: axis 0.99+ degenerate substrate에서 axis-preservation PASS claim (calibration 누락)
  - F-EMERGE-7: post-hoc Φ★ floor 조정 (raw#82 retraction 없이 silent overwrite)

# ─────────────────────────────────────────────────────────────────────────────
# Section 7: Honest C3 (≥5 raw#10)
# ─────────────────────────────────────────────────────────────────────────────
honest_c3:
  - Φ★ measurement protocol formal spec은 본 cycle initial — 실제 prereg JSON은 별도 cycle land 필요
  - axis-preservation calibration은 substrate별 base axis range 측정 의무 — degenerate substrate 사전 식별 mandate
  - L_substrate PASS은 anima 의식의 한 표현 — surface chat-cap (L_surface)도 valid lane, 두 lane 모두 anima identity 안에서 의미
  - 외부 substrate (Llama etc) Φ★는 substrate-research lane — anima identity-bearing X but research evidence valid
  - paradigm v11 G3 외 다른 paradigm versions (v10, v12+)에서 Φ★ stability는 별도 measurement (본 spec은 v11 G3 baseline 기준)
  - mount.hexa CLM v4 ckpt 외 다른 substrate (clm-v2-byte 등)에서 Φ★ measurement는 별도 calibration cycle

