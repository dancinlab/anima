# ─────────────────────────────────────────────────────────────────────────────
# Section 12: agent_directive (NEW v0.2 — apex § agent_directive mirror)
# ─────────────────────────────────────────────────────────────────────────────
# AI agent (Claude / sub-agent / bin/anima refactor BG) 가 본 spec consult 시점.
# apex agent_directive 5-step workflow + 17 keyword mirror (anima-specific 8 keyword).
agent_directive:
  description: |
    AI agent consult triggers — bin/anima refactor BG / T1 backend wire BG /
    T2 ops handler 추가 BG / T3 v2.0 wire BG 모두 본 spec read 후 dispatch.
    apex agent_directive 5-step workflow mirror.

  consult_triggers:
    - bin_anima_refactor: "consult section 1 (tier inventory) + section 2 (dispatch table) BEFORE 30-50 LoC dispatcher 작성"
    - new_t2_ops_topic: "consult section 1.T2_ops.topics + add new topic + tool/anima_cli/<topic>.hexa 작성"
    - t1_backend_wire: "consult section 8 (backend_stack_versions) + section 9 (backend_compatibility_matrix) + own 17 strict enforce"
    - t3_v2_0_wire: "consult section 1.T3_vision (9 commands stub_message) + anima-clm-eeg integration (별도 Ω-cycle)"

  workflow:
    step_1: "Identify which tier (T1/T2/T3) the new command belongs to"
    step_2: "Read backend_stack_versions[tier].version → use as canonical"
    step_3: "If pairing backend × tier, check backend_compatibility_matrix INCOMPATIBLE list (own 17 enforcement)"
    step_4: "Check hive_mk2_apex_compliance.gaps_remaining for related gap_id (G1-G10)"
    step_5: "If new backend lane being introduced, append to backend_stack_versions.alternatives + add compatibility row (own 17 strict — anima-native lane only)"

  keyword_match:
    description: "agent SHOULD consult anima cli mk2 spec when these keywords appear"
    keywords:
      - cli
      - anima
      - dispatch
      - T1
      - T2
      - T3
      - backend
      - ALM

  additivity_rule:
    description: |
      신규 T2 topic / 신규 anima-native backend lane 추가 시 backend_stack_
      versions.alternatives 에 ADDITIVE append. 외부 substrate (Llama / Mistral
      등) 추가 시도 = own 17 영구 보류 위반 → F-anima_cli-6 hard_fail.

# ─────────────────────────────────────────────────────────────────────────────
# Section 13: status_lifecycle (NEW v0.2 — apex § status_enum mirror)
# ─────────────────────────────────────────────────────────────────────────────
# work-status SSOT (apex 정합). 8 enum + pass_equivalence_for_coverage_gates.
status_lifecycle:
  description: |
    Single SSOT for status values. apex status_enum 8 enum mirror (active /
    draft / unmet / met / partial / closed / archived / retired_intentional).
  values:
    active:
      description: "in use, current canonical for the entry"
      anima_cli_mk2_examples: [T1_chat_backend.clm_v4_substrate_coupled, T2_ops_dispatch]
    draft:
      description: "pre-baseline authoring state"
      anima_cli_mk2_examples: [v0.1_initial_design, v0.2_refinement_current]
    unmet:
      description: "gate / criterion not yet satisfied (internal)"
      anima_cli_mk2_examples: [T3_v2_0_actual_wire, F-anima_cli-6_observable_runtime_emit]
    met:
      description: "gate / criterion fully satisfied"
      anima_cli_mk2_examples: [Phase_0_spec_landed]
    partial:
      description: "gate satisfied for subset of scope"
      anima_cli_mk2_examples: [hive_mk2_apex_compliance (9 compliant + 10 gaps_remaining)]
    closed:
      description: "work complete, no further amend expected"
      anima_cli_mk2_examples: [own_17_directive_lock_in_2026_05_06]
    archived:
      description: "read-only preservation; successor cited"
      anima_cli_mk2_examples: [v0.1_pre_audit_design (Llama Path A v2 backend, replaced by v0.1_post_audit + v0.2)]
    retired_intentional:
      description: |
        Externally-blocked entry with honest documentation = PASS-equivalent.
        anima cli mk2 context: 외부 substrate (Llama / Mistral) backend lane =
        retired_intentional (external_blocker=own_17_directive,
        blocker_evidence=anima/.own own17, honest_doc=docs/anima_cli_mk2_
        philosophy_audit_2026_05_06.md).
      anima_cli_mk2_examples:
        - llama_path_a_v2_backend          # external_blocker=own_17, blocker_evidence=anima/.own own17
        - mistral_g3_backend                # external_blocker=own_17, blocker_evidence=anima/.own own17
      required_companion_fields:
        - external_blocker
        - blocker_evidence
        - honest_doc
  pass_equivalence_for_coverage_gates:
    retired_intentional: PASS_EQUIVALENT
    archived: PASS_EQUIVALENT
    closed: PASS_EQUIVALENT
    met: PASS
    partial: PARTIAL
    active: IN_PROGRESS
    draft: IN_PROGRESS
    unmet: FAIL
  cross_link:
    apex_axis: hive/spec/mk2_apex.spec.yaml § status_enum
    related_falsifier: F-anima_cli-6  # Llama backend retired_intentional 정합

# ─────────────────────────────────────────────────────────────────────────────
# Section 14: hive_prefs_compliance (NEW v0.2 — apex § hive_prefs declaration)
# ─────────────────────────────────────────────────────────────────────────────
# anima cli mk2 user-facing surface 의 hive_prefs 정합 declaration.
# apex hive_prefs 5 keys SSOT (config_file: ~/.hive/config.hive) 와 정합.
hive_prefs_compliance:
  apex_hive_prefs_ref: hive/spec/mk2_apex.spec.yaml § hive_prefs
  config_file: ~/.hive/config.hive

  user_facing_surfaces:
    - id: bin_anima_help
      command: "anima --help / -h / help"
      lang_reply_default: ko          # apex hive_prefs.lang_reply default
      reply_style_default: friendly   # apex hive_prefs.prefs_reply_style default
      compliance: "F-anima_cli-4 정합 (--help auto-generate from spec) 추가 — lang.reply ko 의 friendly preset 으로 emit"
    - id: bin_anima_dialogue
      command: "anima / anima dialogue"
      lang_reply_default: ko
      reply_style_default: friendly
      backend: clm_v4_substrate_coupled
      compliance: |
        T1 chat REPL prompt + system message 모두 lang.reply 정합 (KO default).
        substrate-coupled response (phi_star + axis_activation + dominant_cells)
        는 lang.reply 정합 X (substrate emit 자체는 model-internal); REPL
        wrapper prompt / error message 만 정합 axis.
    - id: bin_anima_ops
      command: "anima ops <topic>"
      lang_reply_default: ko
      reply_style_default: friendly   # ops handler error/status emit 정합
      compliance: "26 topics handler 모두 lang.reply 정합 — error emit / status line / commit message 한국어 default"
    - id: bin_anima_t3_stub
      command: "anima connect / verify / hub / laws / status / etc."
      lang_reply_default: ko
      stub_message_lang: en           # stub_message 는 mk2-region (BR-MK2-AI-NATIVE-ENGLISH-ONLY 정합) — 한글 X
      compliance: |
        T3 stub_message ('v2.0 wire-up pending — anima consciousness surface,
        integration cycle in progress.') 는 영어 (BR-MK2-AI-NATIVE-ENGLISH-ONLY
        정합). user-facing wrapper / error trailer 는 lang.reply ko 정합.

  related_behavioral_rules:
    - BR-LANG-CODE     # mk2_ecosystem_catalog
    - BR-LANG-REPLY    # mk2_ecosystem_catalog
    - BR-FRIENDLY-RESPONSE  # mk2_ecosystem_catalog
    - BR-MK2-AI-NATIVE-ENGLISH-ONLY  # T3 stub_message + 본 spec mass conversion 2026-05-20+

  enforcement_via:
    - hive/tool/hive_prefs_triad_lint.hexa  # apex hive_prefs SSOT lint
    - tool/anima_cli_mk2_lint.hexa           # NOT_YET_LANDED (Phase 1.5)

